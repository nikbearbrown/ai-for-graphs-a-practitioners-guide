<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 7.7 — Six design decisions in one bar chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white: #FFFFFF; --color-ink: #121212; --color-red: #C8102E;
    --color-secondary: #545454; --color-border: #D4D4D4; --color-ochre: #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white: #111111; --color-ink: #F0EBE3; --color-red: #E8243A;
      --color-secondary: #A0978C; --color-border: #2E2E2E; --color-ochre: #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; max-width: 65ch; }
  #wrap { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  ol.decisions { list-style: none; padding: 0; }
  ol.decisions li { padding: 12px 0; border-bottom: 1px solid var(--color-border); display: grid; grid-template-columns: 32px 1fr; gap: 12px; cursor: pointer; }
  ol.decisions li.active { background: var(--color-white); }
  .badge { width: 24px; height: 24px; border-radius: 4px; background: var(--color-ink); color: var(--color-white); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  ol.decisions li.active .badge { background: var(--color-red); }
  .decision-name { font-weight: 600; }
  .decision-why { color: var(--color-secondary); font-size: 12px; }
  #chart { width: 100%; height: 460px; }
  .axis text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-secondary); }
  .axis path, .axis line { stroke: var(--color-secondary); shape-rendering: crispEdges; }
  .grid line { stroke: var(--color-border); stroke-dasharray: 2 3; opacity: 0.6; }
  .bar { fill: var(--color-secondary); transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .bar.primary { fill: var(--color-red); }
  .value-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-ink); }
  .highlight { stroke: var(--color-ochre); stroke-width: 2; fill: none; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 7.7 — Six design decisions in one bar chart</h1>
<p class="subtitle">Click a decision on the left to see what it does and what would break if it were reversed. Every element is doing work; nothing is decorative.</p>
<div id="wrap">
  <ol class="decisions" id="decisionList"></ol>
  <div id="chart" role="img" aria-labelledby="ct cd"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const decisions = [
  { id: 'sort',   name: 'Sort order: descending',     why: 'Munzner effectiveness — derive order from primary attribute.' },
  { id: 'zero',   name: 'Zero baseline',              why: "Stevens' power law — area perception calibrates to zero." },
  { id: 'lum',    name: 'Color luminance: redundant', why: "Few's clarity-over-minimization — supports the message." },
  { id: 'annot',  name: 'Score annotations on bars',  why: 'Rank is visual; precision is textual. Both serve the reader.' },
  { id: 'grid',   name: 'Gridlines at low opacity',   why: 'Present for precise reading, invisible while scanning.' },
  { id: 'rot',    name: 'Label rotation (−30°)',      why: 'Gestalt continuity — readable rotated; short labels tolerate it.' }
];

const domainData = [
  { label: 'Memory',   value: 96 },
  { label: 'Pattern',  value: 92 },
  { label: 'Logic',    value: 82 },
  { label: 'Quant',    value: 71 },
  { label: 'Language', value: 64 },
  { label: 'Moral',    value: 47 },
  { label: 'Empathy',  value: 42 },
  { label: 'Embodied', value: 35 }
];

let activeId = 'sort';

const list = d3.select('#decisionList');
list.selectAll('li').data(decisions).join('li')
  .attr('class', d => d.id === activeId ? 'active' : '')
  .on('click', (event, d) => { activeId = d.id; render(); })
  .html((d, i) => `<div class="badge">${i+1}</div>
    <div><div class="decision-name">${d.name}</div><div class="decision-why">${d.why}</div></div>`);

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(e, d) { tooltip.html(`<strong>${d.label}</strong>: ${d.value}`).style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px').transition().duration(150).style('opacity', 1); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function drawChart() {
  d3.select('#chart').selectAll('*').remove();
  const c = document.getElementById('chart');
  const w = c.clientWidth || 600, h = c.clientHeight || 460;
  const svg = d3.select('#chart').append('svg').attr('width', w).attr('height', h)
    .attr('role', 'img').attr('aria-labelledby', 'ct cd');
  svg.append('title').attr('id', 'ct').text('Annotated bar chart of cognitive-domain scores');
  svg.append('desc').attr('id', 'cd').text('Bar chart with sorted bars, zero baseline, redundant luminance, value labels, light gridlines, and rotated category labels.');
  const margin = { top: 32, right: 32, bottom: 80, left: 48 };
  const cw = w - margin.left - margin.right, ch = h - margin.top - margin.bottom;
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
  const x = d3.scaleBand().domain(domainData.map(d => d.label)).range([0, cw]).padding(0.18);
  const y = d3.scaleLinear().domain([0, 100]).range([ch, 0]);
  // gridlines
  g.append('g').attr('class', 'grid')
    .call(d3.axisLeft(y).ticks(5).tickSize(-cw).tickFormat(''));
  // axes
  g.append('g').attr('class', 'axis').attr('transform', `translate(0,${ch})`).call(d3.axisBottom(x))
    .selectAll('text')
      .attr('transform', activeId === 'rot' ? 'rotate(-30)' : 'rotate(0)')
      .style('text-anchor', activeId === 'rot' ? 'end' : 'middle');
  g.append('g').attr('class', 'axis')
    .call(d3.axisLeft(y).ticks(5).tickFormat(d => activeId === 'zero' && d === 0 ? '0' : d));
  // bars with luminance
  const lumScale = d3.scaleLinear().domain([d3.min(domainData, d=>d.value), d3.max(domainData, d=>d.value)]).range([0.85, 0]);
  g.selectAll('.bar').data(domainData).join('rect')
    .attr('class', (d, i) => i === 0 ? 'bar primary' : 'bar')
    .attr('x', d => x(d.label)).attr('y', d => y(d.value))
    .attr('width', x.bandwidth()).attr('height', d => ch - y(d.value))
    .attr('opacity', d => activeId === 'lum' ? 0.4 + (1 - lumScale(d.value)) * 0.6 : 1)
    .attr('tabindex', 0).attr('aria-label', d => `${d.label}: ${d.value}`)
    .on('mouseover', (e, d) => showTip(e, d)).on('mouseout', hideTip);
  // value labels
  if (activeId === 'annot' || true) {
    g.selectAll('.value-label').data(domainData).join('text').attr('class', 'value-label')
      .attr('x', d => x(d.label) + x.bandwidth()/2)
      .attr('y', d => y(d.value) - 6).attr('text-anchor', 'middle')
      .attr('opacity', activeId === 'annot' ? 1 : 0.5)
      .text(d => d.value);
  }
  // highlight overlay for active decision
  const highlights = {
    sort: { x: 0, y: -16, w: cw, h: 6, label: 'descending order from primary attribute' },
    zero: { x: -36, y: ch - 2, w: cw + 36, h: 6, label: 'y-axis begins at 0' },
    grid: { x: 0, y: 0, w: cw, h: ch, label: 'subtle reference lines' },
    annot: { x: 0, y: -20, w: cw, h: 20, label: 'precision via text' },
    lum:  { x: 0, y: 0,   w: cw, h: ch, label: 'sequential luminance reinforces order' },
    rot:  { x: 0, y: ch + 2, w: cw, h: 40, label: '-30° rotation accommodates labels' }
  };
  const hl = highlights[activeId];
  if (hl) {
    g.append('rect').attr('class', 'highlight')
      .attr('x', hl.x).attr('y', hl.y).attr('width', hl.w).attr('height', hl.h);
  }
}

function render() {
  list.selectAll('li').attr('class', d => d.id === activeId ? 'active' : '');
  drawChart();
}
render();
const ro = new ResizeObserver(drawChart);
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
