<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" role="img" aria-labelledby="t03 d03">
  <title id="t03">The four-move prompt — show, say, constrain, verify</title>
  <desc id="d03">Four panels arranged vertically, one per move. Each panel shows the move name, a one-line definition, an example pulled from the cognitive-domain prompt, and a callout naming what Claude decides if the move is skipped.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .badge { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #fdfcfb; }
      .ex { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #2a1a0e; }
    </style>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="540" fill="#fdfcfb"/>

  <text x="350" y="26" text-anchor="middle" class="ti">Move 3 is the move most people skip. It decides whether the output is right on the first attempt.</text>

  <!-- Helper geometry: panel column at x=40..400 width=360 height=88; right callout at x=420..680 -->

  <!-- Move 1: SHOW -->
  <g transform="translate(40,52)">
    <circle cx="22" cy="22" r="18" fill="#2a1a0e"/>
    <text x="22" y="27" text-anchor="middle" class="badge">1</text>
    <rect x="50" y="0" width="350" height="84" fill="#f5f2ee" stroke="#8a8480"/>
    <text x="62" y="20" class="ti">Show what you have</text>
    <text x="62" y="38" class="sm">data shape, columns, types, sample rows, or file name</text>
    <text x="62" y="60" class="ex">"Eight rows. domain (string, 12–17 chars), score (0–100)."</text>
    <text x="62" y="76" class="ex">"Sample: Pattern Recognition 94, Language 87, Memory 96."</text>

    <!-- callout right -->
    <rect x="420" y="0" width="240" height="84" fill="#fdfcfb" stroke="#c8c4c0"/>
    <text x="432" y="20" class="lb">if skipped, the model decides:</text>
    <text x="432" y="40" class="sm">• whether values are %, counts, scores</text>
    <text x="432" y="56" class="sm">• whether order in data is meaningful</text>
    <text x="432" y="72" class="sm">• whether categories share a baseline</text>
  </g>

  <!-- arrow -->
  <path d="M 62 144 L 62 158" stroke="#2a1a0e" fill="none" marker-end="url(#ar3)"/>

  <!-- Move 2: SAY -->
  <g transform="translate(40,162)">
    <circle cx="22" cy="22" r="18" fill="#2a1a0e"/>
    <text x="22" y="27" text-anchor="middle" class="badge">2</text>
    <rect x="50" y="0" width="350" height="84" fill="#f5f2ee" stroke="#8a8480"/>
    <text x="62" y="20" class="ti">Say what you want</text>
    <text x="62" y="38" class="sm">chart type, marks, D3 version, deliverable format</text>
    <text x="62" y="60" class="ex">"Vertical bar chart. D3 v7. Single HTML file with</text>
    <text x="62" y="76" class="ex">inline CSS and CDN-loaded D3. Responsive to resize."</text>

    <rect x="420" y="0" width="240" height="84" fill="#fdfcfb" stroke="#c8c4c0"/>
    <text x="432" y="20" class="lb">if skipped, the model decides:</text>
    <text x="432" y="40" class="sm">• chart type (probably scatter or pie)</text>
    <text x="432" y="56" class="sm">• D3 version (mixes v4 / v6 / v7)</text>
    <text x="432" y="72" class="sm">• rendering target (file vs module)</text>
  </g>

  <path d="M 62 254 L 62 268" stroke="#2a1a0e" fill="none" marker-end="url(#ar3)"/>

  <!-- Move 3: CONSTRAIN — emphasised -->
  <g transform="translate(40,272)">
    <circle cx="22" cy="22" r="18" fill="#2a1a0e"/>
    <text x="22" y="27" text-anchor="middle" class="badge">3</text>
    <rect x="50" y="0" width="350" height="84" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="2"/>
    <text x="62" y="20" class="ti">Constrain it · (the move most people skip)</text>
    <text x="62" y="38" class="sm">channel-to-attribute mappings, layout, accessibility</text>
    <text x="62" y="60" class="ex">"x = domain (sorted desc). y = score from zero.</text>
    <text x="62" y="76" class="ex">Luminance redundant. Labels rotated -30°."</text>

    <rect x="420" y="0" width="240" height="84" fill="#fdfcfb" stroke="#2a1a0e"/>
    <text x="432" y="20" class="lb">if skipped, the model decides:</text>
    <text x="432" y="40" class="sm">• which channel encodes which attribute</text>
    <text x="432" y="56" class="sm">• whether the baseline is zero</text>
    <text x="432" y="72" class="sm">• whether hue, size, or position carries score</text>
  </g>

  <path d="M 62 364 L 62 378" stroke="#2a1a0e" fill="none" marker-end="url(#ar3)"/>

  <!-- Move 4: VERIFY -->
  <g transform="translate(40,382)">
    <circle cx="22" cy="22" r="18" fill="#2a1a0e"/>
    <text x="22" y="27" text-anchor="middle" class="badge">4</text>
    <rect x="50" y="0" width="350" height="84" fill="#f5f2ee" stroke="#8a8480"/>
    <text x="62" y="20" class="ti">Ask for verification</text>
    <text x="62" y="38" class="sm">restate, comment channels, flag unspecified decisions</text>
    <text x="62" y="60" class="ex">"Restate the channel decomposition before coding.</text>
    <text x="62" y="76" class="ex">Comment which line implements which channel."</text>

    <rect x="420" y="0" width="240" height="84" fill="#fdfcfb" stroke="#c8c4c0"/>
    <text x="432" y="20" class="lb">if skipped, the model decides:</text>
    <text x="432" y="40" class="sm">• whether to surface its own assumptions</text>
    <text x="432" y="56" class="sm">• which trade-offs to flag</text>
    <text x="432" y="72" class="sm">• whether to ship or wait for review</text>
  </g>

  <text x="350" y="510" text-anchor="middle" class="cap">The four moves take ~90 seconds longer than a vague prompt. The 90 seconds is the work, not overhead.</text>
</svg>
