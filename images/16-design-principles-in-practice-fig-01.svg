<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t1601 d1601">
  <title id="t1601">A flawed quarterly chart with seven numbered failure callouts</title>
  <desc id="d1601">A 3D bar chart of Q4 sales by region, rainbow colors, truncated y-axis starting at 400, heavy gridlines, rotated 8pt italic labels, and an occasion-named title — annotated with seven failure callouts.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .bad { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 8px; font-style: italic; fill: #4a4540; }
      .num { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-weight: bold; fill: #fdfcfb; }
      .anno { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #2a1a0e; }
    </style>
    <marker id="ar16a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <!-- Title in tiny italic (failure 6) -->
  <text x="180" y="46" text-anchor="middle" class="bad">Q4 Performance Highlights</text>

  <!-- Chart frame (a stylized flawed chart on the left half) -->
  <!-- heavy gridlines at every step (failure 4) -->
  <g stroke="#8a8480" stroke-width="0.75">
    <line x1="80" y1="80" x2="320" y2="80"/>
    <line x1="80" y1="100" x2="320" y2="100"/>
    <line x1="80" y1="120" x2="320" y2="120"/>
    <line x1="80" y1="140" x2="320" y2="140"/>
    <line x1="80" y1="160" x2="320" y2="160"/>
    <line x1="80" y1="180" x2="320" y2="180"/>
    <line x1="80" y1="200" x2="320" y2="200"/>
    <line x1="80" y1="220" x2="320" y2="220"/>
    <line x1="80" y1="240" x2="320" y2="240"/>
    <line x1="80" y1="260" x2="320" y2="260"/>
    <line x1="80" y1="280" x2="320" y2="280"/>
    <line x1="80" y1="300" x2="320" y2="300"/>
  </g>
  <!-- axis -->
  <line x1="80" y1="80" x2="80" y2="300" stroke="#2a1a0e"/>
  <line x1="80" y1="300" x2="320" y2="300" stroke="#2a1a0e"/>

  <!-- y-axis tick labels (truncated; 400K–500K) -->
  <text x="76" y="303" text-anchor="end" class="sm">400</text>
  <text x="76" y="263" text-anchor="end" class="sm">420</text>
  <text x="76" y="223" text-anchor="end" class="sm">440</text>
  <text x="76" y="183" text-anchor="end" class="sm">460</text>
  <text x="76" y="143" text-anchor="end" class="sm">480</text>
  <text x="76" y="103" text-anchor="end" class="sm">500</text>

  <!-- bars with fake 3D perspective (failure 2) and rainbow gradients (failure 3) -->
  <!-- region 1: red, value ~480 → top y=140 -->
  <polygon points="96,140 110,130 110,300 96,300" fill="#7a1f1a"/>
  <polygon points="110,130 124,130 124,300 110,300" fill="#a83a2a"/>
  <!-- region 2: orange, ~470 → top y=160 -->
  <polygon points="140,160 154,150 154,300 140,300" fill="#7a4a1a"/>
  <polygon points="154,150 168,150 168,300 154,300" fill="#b8742a"/>
  <!-- region 3: yellow, ~450 → top y=200 -->
  <polygon points="184,200 198,190 198,300 184,300" fill="#7a6a1a"/>
  <polygon points="198,190 212,190 212,300 198,300" fill="#b8a02a"/>
  <!-- region 4: green, ~440 → top y=220 -->
  <polygon points="228,220 242,210 242,300 228,300" fill="#1f5a2a"/>
  <polygon points="242,210 256,210 256,300 242,300" fill="#3a8a3a"/>
  <!-- region 5: blue, ~430 → top y=240 -->
  <polygon points="272,240 286,230 286,300 272,300" fill="#1a3a6a"/>
  <polygon points="286,230 300,230 300,300 286,300" fill="#2a5aa8"/>

  <!-- rotated tiny italic x-labels (failure 5) -->
  <g class="bad">
    <text x="110" y="318" text-anchor="end" transform="rotate(-45 110 318)">North</text>
    <text x="154" y="318" text-anchor="end" transform="rotate(-45 154 318)">South</text>
    <text x="198" y="318" text-anchor="end" transform="rotate(-45 198 318)">East</text>
    <text x="242" y="318" text-anchor="end" transform="rotate(-45 242 318)">West</text>
    <text x="286" y="318" text-anchor="end" transform="rotate(-45 286 318)">Central</text>
  </g>

  <!-- Numbered callouts (7 failures) — black numbered circles + descriptions on right -->
  <!-- (1) y-axis -->
  <circle cx="68" cy="300" r="9" fill="#2a1a0e"/>
  <text x="68" y="303" text-anchor="middle" class="num">1</text>
  <!-- (2) 3D tops -->
  <circle cx="110" cy="130" r="9" fill="#2a1a0e"/>
  <text x="110" y="133" text-anchor="middle" class="num">2</text>
  <!-- (3) rainbow color -->
  <circle cx="272" cy="270" r="9" fill="#2a1a0e"/>
  <text x="272" y="273" text-anchor="middle" class="num">3</text>
  <!-- (4) gridlines -->
  <circle cx="320" cy="180" r="9" fill="#2a1a0e"/>
  <text x="320" y="183" text-anchor="middle" class="num">4</text>
  <!-- (5) rotated labels -->
  <circle cx="200" cy="340" r="9" fill="#2a1a0e"/>
  <text x="200" y="343" text-anchor="middle" class="num">5</text>
  <!-- (6) title -->
  <circle cx="282" cy="46" r="9" fill="#2a1a0e"/>
  <text x="282" y="49" text-anchor="middle" class="num">6</text>
  <!-- (7) no comparison -->
  <circle cx="200" cy="68" r="9" fill="#2a1a0e"/>
  <text x="200" y="71" text-anchor="middle" class="num">7</text>

  <!-- Right-side legend of failures -->
  <line x1="360" y1="40" x2="360" y2="380" stroke="#c8c4c0" stroke-width="0.75"/>
  <text x="376" y="46" class="ti">Seven visible failures</text>
  <text x="376" y="62" class="sm">Each numbered callout names a principle violated.</text>

  <g class="anno">
    <circle cx="384" cy="84" r="8" fill="#2a1a0e"/>
    <text x="384" y="87" text-anchor="middle" class="num">1</text>
    <text x="400" y="87">y-axis starts at $400K, not zero (Tufte: proportional ink)</text>

    <circle cx="384" cy="114" r="8" fill="#2a1a0e"/>
    <text x="384" y="117" text-anchor="middle" class="num">2</text>
    <text x="400" y="117">3D perspective on bar tops (distorts the position channel)</text>

    <circle cx="384" cy="144" r="8" fill="#2a1a0e"/>
    <text x="384" y="147" text-anchor="middle" class="num">3</text>
    <text x="400" y="147">five rainbow gradients encoding nothing (Bertin: false order)</text>

    <circle cx="384" cy="174" r="8" fill="#2a1a0e"/>
    <text x="384" y="177" text-anchor="middle" class="num">4</text>
    <text x="400" y="177">heavy gridlines at every dollar increment (Tufte: data-ink)</text>

    <circle cx="384" cy="204" r="8" fill="#2a1a0e"/>
    <text x="384" y="207" text-anchor="middle" class="num">5</text>
    <text x="400" y="207">45° rotated labels in 8pt italic (Few: legibility)</text>

    <circle cx="384" cy="234" r="8" fill="#2a1a0e"/>
    <text x="384" y="237" text-anchor="middle" class="num">6</text>
    <text x="400" y="237">title names the occasion, not the finding (Cairo: key message)</text>

    <circle cx="384" cy="264" r="8" fill="#2a1a0e"/>
    <text x="384" y="267" text-anchor="middle" class="num">7</text>
    <text x="400" y="267">no comparison reference — "Q4" against what? (Cairo)</text>
  </g>

  <!-- Score panel -->
  <rect x="376" y="296" width="300" height="70" fill="#f5f2ee" stroke="#2a1a0e"/>
  <text x="386" y="316" class="ti">Audit score</text>
  <text x="386" y="334" class="lb">14 of 22 Evergreen/Emery items fail.</text>
  <text x="386" y="350" class="sm">The chart is more failure than success.</text>

  <text x="350" y="402" text-anchor="middle" class="cap">Seven visible failures. Fourteen of twenty-two checklist items fail.</text>
</svg>
