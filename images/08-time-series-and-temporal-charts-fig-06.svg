<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t08-06 d08-06">
  <title id="t08-06">Line chart vs spiral plot for five years of monthly electricity consumption</title>
  <desc id="d08-06">Left: a 60-point line chart with the seasonal sawtooth visible. Right: the same data wrapped around an Archimedean spiral with one rotation per year, so the winter spikes cluster at the top and summer dips at the bottom.</desc>
  <defs>
    <style>
      .ti  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .mark { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 9.5px; fill: #2a1a0e; }
    </style>
    <marker id="ar8-06" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#fdfcfb"/>
  <text x="380" y="28" text-anchor="middle" class="ti">Same 60 months. Linear chart answers trend; spiral answers cycle.</text>

  <!-- LEFT PANEL: LINE -->
  <g transform="translate(20,60)">
    <text x="0" y="0" class="ti">Linear time series — 60 months, 2019–2023</text>
    <text x="0" y="14" class="sm">trend visible, sawtooth recurs but reads as one long sequence</text>
    <line x1="40" y1="40" x2="40" y2="280" stroke="#8a8480"/>
    <line x1="40" y1="280" x2="340" y2="280" stroke="#8a8480"/>
    <text x="36" y="283" text-anchor="end" class="sm">0</text>
    <text x="36" y="201" text-anchor="end" class="sm">500</text>
    <text x="36" y="123" text-anchor="end" class="sm">1000</text>
    <text x="36" y="43" text-anchor="end" class="sm">1500</text>
    <line x1="38" y1="280" x2="40" y2="280" stroke="#4a4540"/>
    <line x1="38" y1="201" x2="40" y2="201" stroke="#4a4540"/>
    <line x1="38" y1="123" x2="40" y2="123" stroke="#4a4540"/>
    <line x1="38" y1="43" x2="40" y2="43" stroke="#4a4540"/>
    <!-- 60 monthly values (kWh in arbitrary scale, 600–1300, sinusoidal seasonal cycle + slow upward trend)
         For y, factor = 240px/1500 = 0.16. y = 280 - v*0.16
         step in x = 300/59 ≈ 5.085
         Generate from formula: v(i) = 850 + 8*i + 350*cos(2π*(i%12)/12), where i=0 corresponds to Jan -->
    <!-- I'll precompute key values for the polyline. Use 60 points: -->
    <!-- For visual approximation, I write out as a single polyline. -->
    <polyline points="40,88.8 45.085,93.62 50.17,113.27 55.255,140.16 60.34,170.10 65.42,195.32 70.51,209.99 75.59,209.55 80.68,194.45 85.76,168.40 90.85,138.84 95.93,113.10 101.02,90.36 106.10,93.46 111.18,111.91 116.27,137.84 121.36,167.13 126.44,192.04 131.53,206.71 136.61,206.43 141.70,191.81 146.78,166.40 151.87,137.32 156.95,111.74 162.04,89.16 167.12,91.46 172.20,109.27 177.29,134.66 182.37,163.55 187.46,188.16 192.54,203.07 197.63,203.31 202.71,189.17 207.80,164.40 212.88,135.96 217.97,110.94 223.05,89.21 228.13,90.78 233.22,107.94 238.30,132.88 243.39,161.32 248.47,185.81 253.56,200.94 258.64,201.51 263.73,187.97 268.81,163.71 273.90,135.93 278.98,111.39 284.06,90.19 289.15,90.84 294.23,107.59 299.32,131.96 304.40,160.07 309.49,184.51 314.57,199.86 319.66,200.79 324.74,187.42 329.83,163.79 334.91,136.46 340,112.79"
              fill="none" stroke="#2a1a0e" stroke-width="1.3"/>
    <!-- annotate winter spike on year 4 and summer dip -->
    <circle cx="284.06" cy="90.19" r="3" fill="#c8860e"/>
    <text x="290" y="86" class="sm">winter spike (Jan&apos;23)</text>
    <circle cx="253.56" cy="200.94" r="3" fill="#c8860e"/>
    <text x="200" y="218" class="sm">summer dip (Jul&apos;22)</text>
    <g class="sm">
      <text x="40"   y="298" text-anchor="middle">2019</text>
      <text x="101"  y="298" text-anchor="middle">2020</text>
      <text x="162"  y="298" text-anchor="middle">2021</text>
      <text x="223"  y="298" text-anchor="middle">2022</text>
      <text x="284"  y="298" text-anchor="middle">2023</text>
      <text x="340"  y="298" text-anchor="middle">end</text>
    </g>
    <text x="180" y="324" text-anchor="middle" class="lb">answers: "is consumption rising?"</text>
  </g>

  <!-- DIVIDER -->
  <line x1="395" y1="36" x2="395" y2="420" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- RIGHT PANEL: SPIRAL -->
  <g transform="translate(575,210)">
    <text x="-160" y="-150" class="ti">Spiral plot — one rotation per year</text>
    <text x="-160" y="-136" class="sm">January at 12 o&apos;clock; winter spikes cluster at top, summer dips at bottom</text>
    <!-- Draw 12 clock-position rays + Jan/Apr/Jul/Oct labels -->
    <g stroke="#c8c4c0" stroke-width="0.6">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="0" y1="0" x2="-150" y2="0"/>
    </g>
    <text x="0"  y="-160" text-anchor="middle" class="mark">Jan</text>
    <text x="160" y="4" text-anchor="start" class="mark">Apr</text>
    <text x="0"  y="170" text-anchor="middle" class="mark">Jul</text>
    <text x="-160" y="4" text-anchor="end" class="mark">Oct</text>
    <!-- Archimedean spiral with 5 rotations.
         r(θ) = r0 + b*θ, r0 = 30, total radius range up to ~140, so b ≈ (140-30)/(5*2π) ≈ 3.5 per radian
         angle starts at -π/2 (Jan) and runs 5 full turns clockwise.
         Sample 60 monthly points: i = 0..59
         θ(i) = -π/2 + (i / 12) * 2π
         r(i) = 30 + (i / 60) * 110 [trend]; then add seasonal modulation perpendicular thickness? Use radial offset:
         actual r(i) = base(i) + seasonal_amp * cos((i%12)/12 * 2π)   where seasonal_amp = 12
         For Jan (i%12 == 0), cos = 1 → +12 (peak outward = bigger consumption)
         For Jul (i%12 == 6), cos = -1 → -12 (smaller)
         This gives outward bumps at top of spiral, inward bumps at bottom. -->
    <!-- Precomputed points (60 of them); listing only path coords inline -->
    <path d="M 0.0,-42.0
             L 6.49,-37.18
             L 14.59,-29.96
             L 24.39,-21.46
             L 35.47,-12.97
             L 47.36,-5.86
             L 59.43,-1.43
             L 70.91,0.43
             L 80.78,-0.10
             L 88.06,-2.84
             L 92.40,-7.91
             L 93.41,-15.50
             L 91.10,-25.49
             L 85.65,-37.45
             L 77.45,-50.66
             L 67.20,-64.20
             L 55.85,-77.06
             L 44.31,-88.16
             L 33.42,-96.41
             L 23.74,-100.97
             L 15.61,-101.39
             L 9.13,-97.66
             L 4.21,-90.21
             L 0.78,-79.83
             L -1.31,-67.45
             L -2.07,-54.07
             L -1.50,-40.66
             L 0.45,-28.18
             L 4.07,-17.49
             L 9.59,-9.27
             L 17.16,-4.05
             L 26.83,-2.18
             L 38.51,-3.83
             L 51.94,-9.05
             L 66.61,-17.74
             L 81.71,-29.74
             L 96.20,-44.78
             L 108.81,-62.41
             L 118.10,-81.97
             L 122.65,-102.43
             L 121.43,-122.51
             L 113.69,-140.79
             L 99.34,-155.83
             L 78.93,-166.20
             L 53.71,-170.49
             L 25.37,-167.45
             L -4.34,-156.16
             L -33.55,-136.30
             L -59.96,-108.42
             L -81.41,-74.07
             L -96.06,-35.86
             L -102.78,3.59
             L -101.27,42.30
             L -91.99,77.30
             L -76.06,105.96
             L -55.21,126.18
             L -31.41,136.50
             L -6.86,136.18
             L 17.50,125.27
             L 40.07,104.49
             L 59.51,75.16"
          fill="none" stroke="#2a1a0e" stroke-width="1.4"/>
    <!-- Mark winter spikes (top of spiral) and summer dips -->
    <circle cx="0" cy="-42" r="3" fill="#c8860e"/>
    <circle cx="0" cy="-79.83" r="3" fill="#c8860e"/>
    <!-- Annotation -->
    <path d="M 60 -150 L 6 -45" fill="none" stroke="#2a1a0e" stroke-dasharray="3 2" marker-end="url(#ar8-06)"/>
    <text x="62" y="-148" class="sm">winter spikes</text>
    <text x="62" y="-136" class="sm">cluster near 12 o&apos;clock</text>
    <path d="M -90 110 L -50 95" fill="none" stroke="#2a1a0e" stroke-dasharray="3 2" marker-end="url(#ar8-06)"/>
    <text x="-178" y="118" class="sm">summer dips</text>
    <text x="-178" y="130" class="sm">cluster near 6 o&apos;clock</text>
    <text x="0" y="180" text-anchor="middle" class="lb">answers: "is the seasonal pattern consistent?"</text>
  </g>

  <!-- bottom trade-off note -->
  <g transform="translate(20,400)">
    <rect width="720" height="40" fill="none" stroke="#c8860e" stroke-width="2"/>
    <text x="12" y="16" class="lb">Trade-off: spiral plots accept lower channel accuracy (position-along-a-curve) to make cyclic structure perceptible as one shape.</text>
    <text x="12" y="32" class="sm">Use it when the cycle is the question. For cross-year comparison, prefer small multiples on a shared linear axis.</text>
  </g>
</svg>
