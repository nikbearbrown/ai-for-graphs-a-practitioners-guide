<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t1303 d1303">
  <title id="t1303">Three magnitude-family flow forms: Sankey, alluvial, ribbon chord</title>
  <desc id="d1303">Three side-by-side panels comparing Sankey, alluvial, and ribbon chord layouts. Each panel uses width as the magnitude channel but answers a different question.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .q   { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-weight: bold; fill: #2a1a0e; }
      .nd { fill: #2a1a0e; }
    </style>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>
  <text x="350" y="26" text-anchor="middle" class="ti">Three layouts. One channel (width). Three question structures.</text>

  <!-- PANEL A: SANKEY -->
  <g transform="translate(20,60)">
    <text x="0" y="0" class="ti">A. Sankey</text>
    <text x="0" y="14" class="q">Q: how much flows A → B → C?</text>
    <!-- left nodes -->
    <rect class="nd" x="20" y="50" width="10" height="50"/>
    <rect class="nd" x="20" y="110" width="10" height="30"/>
    <text x="16" y="64" text-anchor="end" class="sm">S1</text>
    <text x="16" y="124" text-anchor="end" class="sm">S2</text>
    <!-- mid nodes -->
    <rect class="nd" x="100" y="50" width="10" height="40"/>
    <rect class="nd" x="100" y="100" width="10" height="40"/>
    <text x="116" y="64"  class="sm">T1</text>
    <text x="116" y="114" class="sm">T2</text>
    <!-- right nodes -->
    <rect class="nd" x="180" y="50" width="10" height="40"/>
    <rect class="nd" x="180" y="100" width="10" height="40"/>
    <text x="196" y="64"  class="sm">E1</text>
    <text x="196" y="114" class="sm">E2</text>
    <!-- flows -->
    <path d="M 30 50 C 65 50, 65 50, 100 50 L 100 80 C 65 80, 65 80, 30 80 Z" fill="#4a4540" fill-opacity="0.55"/>
    <path d="M 30 80 C 65 80, 65 100, 100 100 L 100 120 C 65 120, 65 100, 30 100 Z" fill="#8a8480" fill-opacity="0.55"/>
    <path d="M 30 110 C 65 110, 65 130, 100 130 L 100 140 C 65 140, 65 120, 30 120 Z" fill="#c8c4c0" fill-opacity="0.7"/>
    <path d="M 110 50 C 145 50, 145 50, 180 50 L 180 80 C 145 80, 145 80, 110 80 Z" fill="#4a4540" fill-opacity="0.55"/>
    <path d="M 110 80 C 145 80, 145 100, 180 100 L 180 130 C 145 130, 145 110, 110 110 Z" fill="#8a8480" fill-opacity="0.55"/>
    <path d="M 110 120 C 145 120, 145 130, 180 130 L 180 140 C 145 140, 145 130, 110 130 Z" fill="#c8c4c0" fill-opacity="0.7"/>

    <text x="105" y="180" text-anchor="middle" class="sm">left-to-right; directional</text>
    <text x="105" y="194" text-anchor="middle" class="sm">5–30 nodes / 2–4 columns</text>
  </g>

  <!-- divider -->
  <line x1="240" y1="50" x2="240" y2="320" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- PANEL B: ALLUVIAL -->
  <g transform="translate(260,60)">
    <text x="0" y="0" class="ti">B. Alluvial</text>
    <text x="0" y="14" class="q">Q: how did categories shift across time?</text>
    <!-- three time columns with bands shifting -->
    <!-- t=1 -->
    <rect class="nd" x="20" y="50"  width="6" height="40"/>
    <rect class="nd" x="20" y="100" width="6" height="30"/>
    <rect class="nd" x="20" y="140" width="6" height="20"/>
    <text x="23" y="48" text-anchor="middle" class="sm">2018</text>
    <!-- t=2 -->
    <rect class="nd" x="100" y="50"  width="6" height="36"/>
    <rect class="nd" x="100" y="96"  width="6" height="32"/>
    <rect class="nd" x="100" y="138" width="6" height="22"/>
    <text x="103" y="48" text-anchor="middle" class="sm">2020</text>
    <!-- t=3 -->
    <rect class="nd" x="180" y="50"  width="6" height="30"/>
    <rect class="nd" x="180" y="90"  width="6" height="34"/>
    <rect class="nd" x="180" y="134" width="6" height="26"/>
    <text x="183" y="48" text-anchor="middle" class="sm">2022</text>
    <!-- flows t1->t2 (with crossing) -->
    <path d="M 26 50 C 63 50, 63 50, 100 50 L 100 76 C 63 76, 63 76, 26 76 Z" fill="#4a4540" fill-opacity="0.55"/>
    <path d="M 26 76 C 63 76, 63 86, 100 86 L 100 96 C 63 96, 63 86, 26 86 Z" fill="#4a4540" fill-opacity="0.55"/>
    <path d="M 26 86 C 63 86, 63 96, 100 96 L 100 110 C 63 110, 63 100, 26 100 Z" fill="#8a8480" fill-opacity="0.55"/>
    <path d="M 26 100 C 63 100, 63 110, 100 110 L 100 128 C 63 128, 63 118, 26 118 Z" fill="#8a8480" fill-opacity="0.55"/>
    <path d="M 26 118 C 63 118, 63 138, 100 138 L 100 148 C 63 148, 63 128, 26 128 Z" fill="#c8c4c0" fill-opacity="0.7"/>
    <path d="M 26 128 C 63 128, 63 148, 100 148 L 100 160 C 63 160, 63 140, 26 140 Z" fill="#c8c4c0" fill-opacity="0.7"/>
    <!-- flows t2->t3 -->
    <path d="M 106 50 C 143 50, 143 50, 180 50 L 180 70 C 143 70, 143 70, 106 70 Z" fill="#4a4540" fill-opacity="0.55"/>
    <path d="M 106 70 C 143 70, 143 80, 180 80 L 180 86 C 143 86, 143 76, 106 76 Z" fill="#4a4540" fill-opacity="0.55"/>
    <path d="M 106 86 C 143 86, 143 90, 180 90 L 180 110 C 143 110, 143 106, 106 106 Z" fill="#8a8480" fill-opacity="0.55"/>
    <path d="M 106 106 C 143 106, 143 110, 180 110 L 180 124 C 143 124, 143 124, 106 124 Z" fill="#8a8480" fill-opacity="0.55"/>
    <path d="M 106 138 C 143 138, 143 134, 180 134 L 180 150 C 143 150, 143 154, 106 154 Z" fill="#c8c4c0" fill-opacity="0.7"/>
    <path d="M 106 154 C 143 154, 143 150, 180 150 L 180 160 C 143 160, 143 160, 106 160 Z" fill="#c8c4c0" fill-opacity="0.7"/>

    <text x="105" y="180" text-anchor="middle" class="sm">longitudinal categorical</text>
    <text x="105" y="194" text-anchor="middle" class="sm">3–6 time points typical</text>
  </g>

  <!-- divider -->
  <line x1="480" y1="50" x2="480" y2="320" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- PANEL C: RIBBON CHORD -->
  <g transform="translate(500,60)">
    <text x="0" y="0" class="ti">C. Ribbon chord</text>
    <text x="0" y="14" class="q">Q: how much flows between any pair?</text>
    <!-- circle with 6 arcs and a few ribbons inside -->
    <g transform="translate(100,120)">
      <!-- outer ring arcs (six arcs around 360 degrees, gap 6deg each) -->
      <!-- ring -->
      <circle cx="0" cy="0" r="58" fill="none" stroke="#c8c4c0" stroke-width="0.75"/>
      <!-- six arc segments approximated by small wedge tics -->
      <g stroke="#2a1a0e" stroke-width="6" fill="none">
        <path d="M 50.2 -29 A 58 58 0 0 1 50.2 29"/>
        <path d="M 29 50.2 A 58 58 0 0 1 -29 50.2"/>
        <path d="M -50.2 29 A 58 58 0 0 1 -50.2 -29"/>
        <path d="M -29 -50.2 A 58 58 0 0 1 29 -50.2"/>
      </g>
      <!-- labels around -->
      <text x="68" y="3"   class="sm">FR</text>
      <text x="0"  y="74" text-anchor="middle" class="sm">DE</text>
      <text x="-68" y="3" text-anchor="end" class="sm">IT</text>
      <text x="0"  y="-66" text-anchor="middle" class="sm">UK</text>
      <!-- ribbons (thicker = larger flow) -->
      <!-- FR <-> DE (thick) -->
      <path d="M 50 -10 Q 0 0 10 50 Q 0 0 50 10 Z" fill="#4a4540" fill-opacity="0.55"/>
      <!-- FR <-> UK (medium) -->
      <path d="M 50 -4 Q 0 0 -4 -55 Q 0 0 4 -55 Q 0 0 50 4 Z" fill="#8a8480" fill-opacity="0.55"/>
      <!-- DE <-> IT (thin) -->
      <path d="M -3 50 Q 0 0 -50 3 Q 0 0 -50 -1 Q 0 0 3 50 Z" fill="#c8c4c0" fill-opacity="0.7"/>
      <!-- UK <-> IT (thin) -->
      <path d="M -5 -54 Q 0 0 -50 -5 Q 0 0 -50 -1 Q 0 0 -1 -55 Z" fill="#c8c4c0" fill-opacity="0.7"/>
    </g>
    <text x="105" y="262" text-anchor="middle" class="sm">circular, symmetric</text>
    <text x="105" y="276" text-anchor="middle" class="sm">6–20 entities</text>
  </g>

  <!-- bottom strip with shared takeaways -->
  <g transform="translate(40,340)">
    <text x="0"   y="0" class="lb">Width ranks third in Cleveland &amp; McGill: less accurate than position, more accurate than area or color intensity.</text>
    <text x="0"   y="18" class="sm">Choose by question structure: directional flow → Sankey; longitudinal categorical → alluvial; symmetric pairs → ribbon chord.</text>
  </g>

  <text x="350" y="432" text-anchor="middle" class="cap">Three forms, one magnitude channel, three layouts for three question structures.</text>
</svg>
