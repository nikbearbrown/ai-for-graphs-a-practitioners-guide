<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t15-2 d15-2">
  <title id="t15-2">Gauge chart versus bullet graph — same KPI, different channels</title>
  <desc id="d15-2">Left panel shows a semicircular gauge with a needle at 87 percent. Right panel shows a bullet graph with a bar to 87, target at 85, and three sequential-luminance bands. The bullet graph encodes magnitude with position; the gauge encodes it with angle.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .val { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
    </style>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>

  <!-- LEFT: GAUGE -->
  <text x="32" y="32" class="ti">A. Gauge chart</text>
  <text x="32" y="48" class="sm">Angular position — Cleveland &amp; McGill rank 4.</text>

  <!-- semicircular dial centered at cx=170, cy=200, r=110 -->
  <!-- bands: 0..60 light, 60..85 mid, 85..100 dark; angles 180°..0° -->
  <!-- 180° at left, 0° at right; angle(v) = 180 - (v/100)*180 -->
  <!-- path uses A rx ry x-axis large-arc sweep x y -->
  <!-- band1 0..60: 180→72° -->
  <path d="M 60 200 A 110 110 0 0 1 230 95.65" stroke="#c8c4c0" stroke-width="22" fill="none"/>
  <!-- band2 60..85: 72°→27° -->
  <path d="M 230 95.65 A 110 110 0 0 1 268 107.7" stroke="#8a8480" stroke-width="22" fill="none"/>
  <!-- band3 85..100: 27°→0° -->
  <path d="M 268 107.7 A 110 110 0 0 1 280 200" stroke="#4a4540" stroke-width="22" fill="none"/>

  <!-- needle at 87% → angle = 180 - 0.87*180 = 23.4°  -->
  <!-- needle tip: cx + r*cos(angle), cy - r*sin(angle); r=96 -->
  <!-- cos(23.4)=0.918, sin(23.4)=0.397 → (170+88.1, 200-38.1) = (258.1, 161.9) -->
  <line x1="170" y1="200" x2="258.1" y2="161.9" stroke="#2a1a0e" stroke-width="2.5"/>
  <circle cx="170" cy="200" r="6" fill="#2a1a0e"/>

  <!-- target marker at 85% → angle 27° → r=120 -->
  <!-- cos(27)=0.891, sin(27)=0.454 → 170+106.9=276.9, 200-54.5=145.5; inner r=100: 259.1, 154.6 -->
  <line x1="259.1" y1="154.6" x2="276.9" y2="145.5" stroke="#2a1a0e" stroke-width="1.8"/>

  <!-- tick labels around dial: 0 at left, 50 at top, 100 at right -->
  <text x="60" y="216" text-anchor="middle" class="sm">0</text>
  <text x="170" y="86" text-anchor="middle" class="sm">50</text>
  <text x="282" y="216" text-anchor="middle" class="sm">100</text>

  <!-- value label below -->
  <text x="170" y="246" text-anchor="middle" class="val">87%</text>
  <text x="170" y="262" text-anchor="middle" class="sm">target 85%</text>

  <!-- annotation -->
  <path d="M 318 162 L 264 162" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ar2)"/>
  <text x="322" y="158" class="lb">Needle angle</text>
  <text x="322" y="172" class="sm">encodes magnitude</text>
  <text x="322" y="184" class="sm">via angular position</text>

  <!-- footprint indicator -->
  <rect x="50" y="290" width="240" height="56" fill="none" stroke="#c8c4c0" stroke-dasharray="4 3"/>
  <text x="170" y="312" text-anchor="middle" class="sm">Footprint: ≈ 240 × 110 px</text>
  <text x="170" y="328" text-anchor="middle" class="sm">decorative dial face required</text>

  <!-- divider -->
  <line x1="360" y1="20" x2="360" y2="440" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- RIGHT: BULLET GRAPH -->
  <text x="378" y="32" class="ti">B. Bullet graph</text>
  <text x="378" y="48" class="sm">Position along a common scale — Cleveland &amp; McGill rank 1.</text>

  <!-- bullet bar area: x 400..680, y center around 170; total range 0..100 → 280 px so 2.8 px/unit -->
  <!-- bands behind: 0..60 light, 60..85 mid, 85..100 dark -->
  <!-- y from 150 to 200 (50 px tall) -->
  <rect x="400" y="150" width="168" height="50" fill="#e6e0d8"/>
  <rect x="568" y="150" width="70"  height="50" fill="#c8c4c0"/>
  <rect x="638" y="150" width="42"  height="50" fill="#8a8480"/>

  <!-- primary bar (actual value: 87% → 0..243.6 px → x = 400..643.6) -->
  <rect x="400" y="166" width="243.6" height="18" fill="#2a1a0e"/>

  <!-- target marker at 85% → x = 400 + 238 = 638 -->
  <line x1="638" y1="146" x2="638" y2="204" stroke="#2a1a0e" stroke-width="3"/>

  <!-- axis -->
  <line x1="400" y1="200" x2="680" y2="200" stroke="#8a8480"/>
  <g class="sm" text-anchor="middle">
    <text x="400" y="216">0</text>
    <text x="540" y="216">50</text>
    <text x="680" y="216">100</text>
  </g>
  <line x1="400" y1="200" x2="400" y2="204" stroke="#4a4540"/>
  <line x1="540" y1="200" x2="540" y2="204" stroke="#4a4540"/>
  <line x1="680" y1="200" x2="680" y2="204" stroke="#4a4540"/>

  <!-- band labels above -->
  <g class="sm" text-anchor="middle">
    <text x="484" y="142">poor</text>
    <text x="603" y="142">acceptable</text>
    <text x="659" y="142">good</text>
  </g>

  <!-- value label and target -->
  <text x="378" y="172" class="val">87%</text>
  <text x="378" y="186" class="sm">target 85</text>

  <!-- annotation arrow to bar endpoint -->
  <path d="M 690 230 L 690 192 L 648 184" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ar2)"/>
  <text x="690" y="248" text-anchor="end" class="lb">Bar endpoint</text>
  <text x="690" y="262" text-anchor="end" class="sm">encodes magnitude</text>
  <text x="690" y="274" text-anchor="end" class="sm">via position from zero</text>

  <!-- annotation: target tick -->
  <path d="M 640 320 L 638 210" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ar2)"/>
  <text x="640" y="334" text-anchor="end" class="lb">Target tick (85)</text>
  <text x="640" y="346" text-anchor="end" class="sm">perpendicular to bar</text>

  <!-- footprint -->
  <rect x="400" y="370" width="280" height="20" fill="none" stroke="#c8c4c0" stroke-dasharray="4 3"/>
  <text x="540" y="384" text-anchor="middle" class="sm">Footprint: ≈ 280 × 20 px — roughly 1/6 the gauge's vertical space</text>

  <!-- footer caption -->
  <text x="350" y="430" text-anchor="middle" class="cap">Same data. The bullet graph is more accurate and uses less space. Few's argument is not stylistic.</text>
</svg>
