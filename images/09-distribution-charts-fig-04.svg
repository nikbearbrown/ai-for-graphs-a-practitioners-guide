<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t09f04 d09f04">
  <title id="t09f04">Box plot anatomy — Tukey's design vs the min-to-max imposter</title>
  <desc id="d09f04">Annotated box plot labelling Q1, median, Q3, IQR, Tukey whisker fence, and outlier points; a second panel shows a min-to-max whisker box that is not a Tukey box plot.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .v { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-weight: bold; }
    </style>
    <marker id="ar09b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="350" y="28" text-anchor="middle" class="ti">Tukey's design is specific. The fence is what makes the outlier visible.</text>

  <!-- LEFT: Tukey box plot anatomy -->
  <g transform="translate(0,0)">
    <text x="32" y="60" class="ti">A. Tukey's box plot — annotated</text>

    <!-- vertical axis purely decorative -->
    <line x1="180" y1="80" x2="180" y2="340" stroke="#8a8480"/>

    <!-- Box plot at x=180; values: Q1=200, Q3=140 (top); median 175; whisker hi 100, whisker lo 270; outliers 90, 310, 322 -->
    <!-- whiskers -->
    <line x1="180" y1="100" x2="180" y2="270" stroke="#2a1a0e"/>
    <line x1="160" y1="100" x2="200" y2="100" stroke="#2a1a0e"/>
    <line x1="160" y1="270" x2="200" y2="270" stroke="#2a1a0e"/>
    <!-- box -->
    <rect x="150" y="140" width="60" height="60" fill="#f5f2ee" stroke="#2a1a0e"/>
    <!-- median -->
    <line x1="150" y1="175" x2="210" y2="175" stroke="#2a1a0e" stroke-width="2"/>
    <!-- outliers -->
    <circle cx="180" cy="90"  r="3" fill="#2a1a0e"/>
    <circle cx="180" cy="310" r="3" fill="#2a1a0e"/>
    <circle cx="180" cy="322" r="3" fill="#2a1a0e"/>

    <!-- callouts and arrows to box top, median, box bottom, whisker, outlier -->
    <!-- box top -->
    <path d="M 260 140 L 220 140" fill="none" stroke="#4a4540" marker-end="url(#ar09b)"/>
    <text x="264" y="143" class="lb">Q3 — 75th percentile</text>
    <!-- median -->
    <path d="M 260 175 L 220 175" fill="none" stroke="#4a4540" marker-end="url(#ar09b)"/>
    <text x="264" y="178" class="lb">median — Q2 (50th)</text>
    <!-- box bottom -->
    <path d="M 260 200 L 220 200" fill="none" stroke="#4a4540" marker-end="url(#ar09b)"/>
    <text x="264" y="203" class="lb">Q1 — 25th percentile</text>
    <!-- IQR -->
    <path d="M 130 170 L 148 170" fill="none" stroke="#4a4540" marker-end="url(#ar09b)"/>
    <text x="128" y="173" text-anchor="end" class="lb">IQR = box height</text>
    <!-- whisker high -->
    <path d="M 260 100 L 210 100" fill="none" stroke="#4a4540" marker-end="url(#ar09b)"/>
    <text x="264" y="103" class="lb">whisker fence</text>
    <text x="264" y="116" class="sm">= most extreme value</text>
    <text x="264" y="128" class="sm">within Q3 + 1.5 × IQR</text>
    <!-- outliers callout -->
    <path d="M 260 315 L 192 315" fill="none" stroke="#4a4540" marker-end="url(#ar09b)"/>
    <text x="264" y="318" class="lb">outliers — beyond fence</text>
  </g>

  <!-- divider -->
  <line x1="490" y1="50" x2="490" y2="380" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- RIGHT: min-to-max imposter -->
  <g transform="translate(490,0)">
    <text x="16" y="60" class="ti">B. Min-to-max whiskers</text>
    <text x="16" y="76" class="sm">looks like a box plot — isn't one</text>

    <!-- axis -->
    <line x1="100" y1="90" x2="100" y2="340" stroke="#8a8480"/>

    <!-- whiskers extend ALL the way to data extremes (no outliers exist by construction) -->
    <line x1="100" y1="90"  x2="100" y2="322" stroke="#2a1a0e"/>
    <line x1="80"  y1="90"  x2="120" y2="90"  stroke="#2a1a0e"/>
    <line x1="80"  y1="322" x2="120" y2="322" stroke="#2a1a0e"/>
    <!-- box -->
    <rect x="70" y="140" width="60" height="60" fill="#f5f2ee" stroke="#2a1a0e"/>
    <!-- median -->
    <line x1="70" y1="175" x2="130" y2="175" stroke="#2a1a0e" stroke-width="2"/>

    <!-- callouts -->
    <path d="M 160 90  L 122 90"  fill="none" stroke="#4a4540" marker-end="url(#ar09b)"/>
    <text x="164" y="93" class="lb">whisker = data max</text>
    <path d="M 160 322 L 122 322" fill="none" stroke="#4a4540" marker-end="url(#ar09b)"/>
    <text x="164" y="325" class="lb">whisker = data min</text>

    <text x="164" y="200" class="lb">no fence — no outliers</text>
    <text x="164" y="216" class="sm">by construction every value</text>
    <text x="164" y="228" class="sm">lies inside the whiskers</text>

    <rect x="16" y="350" width="180" height="22" fill="#f5f2ee" stroke="#2a1a0e"/>
    <text x="106" y="365" text-anchor="middle" class="v" fill="#2a1a0e">verdict: range chart, not Tukey</text>
  </g>

  <text x="350" y="404" text-anchor="middle" class="cap">First audit check for any box plot: do the whiskers stop at 1.5 × IQR, or do they extend to min/max?</text>
</svg>
