<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t10-02 d10-02">
  <title id="t10-02">Four scatterplots with the same r ≈ 0.7</title>
  <desc id="d10-02">Four small panels share the same correlation coefficient. The cloud shapes differ — linear, curved, fan, and outlier-driven — exposing what the statistic alone cannot show.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .badge { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-weight: bold; fill: #2a1a0e; }
    </style>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>
  <text x="350" y="26" text-anchor="middle" class="ti">Same r ≈ 0.7. Four very different clouds.</text>

  <!-- PANEL 1: linear -->
  <g transform="translate(40,60)">
    <text x="0" y="0" class="ti">1. Linear cloud</text>
    <text x="0" y="14" class="sm">trend line summarises it correctly</text>
    <rect x="0" y="20" width="260" height="140" fill="none" stroke="#c8c4c0"/>
    <line x1="0" y1="160" x2="260" y2="160" stroke="#8a8480"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#8a8480"/>
    <g fill="#4a4540" fill-opacity="0.6">
      <circle cx="14"  cy="148" r="2.2"/><circle cx="24"  cy="140" r="2.2"/><circle cx="32"  cy="146" r="2.2"/>
      <circle cx="42"  cy="132" r="2.2"/><circle cx="52"  cy="136" r="2.2"/><circle cx="60"  cy="126" r="2.2"/>
      <circle cx="70"  cy="118" r="2.2"/><circle cx="80"  cy="122" r="2.2"/><circle cx="90"  cy="108" r="2.2"/>
      <circle cx="100" cy="114" r="2.2"/><circle cx="110" cy="102" r="2.2"/><circle cx="120" cy="98"  r="2.2"/>
      <circle cx="130" cy="92"  r="2.2"/><circle cx="140" cy="86"  r="2.2"/><circle cx="150" cy="90"  r="2.2"/>
      <circle cx="160" cy="78"  r="2.2"/><circle cx="170" cy="74"  r="2.2"/><circle cx="180" cy="68"  r="2.2"/>
      <circle cx="190" cy="62"  r="2.2"/><circle cx="200" cy="56"  r="2.2"/><circle cx="210" cy="50"  r="2.2"/>
      <circle cx="220" cy="44"  r="2.2"/><circle cx="232" cy="40"  r="2.2"/><circle cx="244" cy="34"  r="2.2"/>
    </g>
    <line x1="6" y1="150" x2="254" y2="38" stroke="#2a1a0e" stroke-width="1.4"/>
    <text x="254" y="34" text-anchor="end" class="badge">r = 0.71</text>
  </g>

  <!-- PANEL 2: curved -->
  <g transform="translate(360,60)">
    <text x="0" y="0" class="ti">2. Curved cloud (quadratic)</text>
    <text x="0" y="14" class="sm">linear fit misrepresents the shape</text>
    <rect x="0" y="20" width="260" height="140" fill="none" stroke="#c8c4c0"/>
    <line x1="0" y1="160" x2="260" y2="160" stroke="#8a8480"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#8a8480"/>
    <g fill="#4a4540" fill-opacity="0.6">
      <circle cx="14"  cy="42"  r="2.2"/><circle cx="24"  cy="56"  r="2.2"/><circle cx="34"  cy="70"  r="2.2"/>
      <circle cx="46"  cy="84"  r="2.2"/><circle cx="58"  cy="98"  r="2.2"/><circle cx="68"  cy="108" r="2.2"/>
      <circle cx="78"  cy="116" r="2.2"/><circle cx="88"  cy="124" r="2.2"/><circle cx="98"  cy="132" r="2.2"/>
      <circle cx="110" cy="138" r="2.2"/><circle cx="122" cy="142" r="2.2"/><circle cx="132" cy="144" r="2.2"/>
      <circle cx="144" cy="144" r="2.2"/><circle cx="154" cy="142" r="2.2"/><circle cx="166" cy="138" r="2.2"/>
      <circle cx="178" cy="130" r="2.2"/><circle cx="188" cy="120" r="2.2"/><circle cx="198" cy="108" r="2.2"/>
      <circle cx="208" cy="94"  r="2.2"/><circle cx="218" cy="80"  r="2.2"/><circle cx="228" cy="66"  r="2.2"/>
      <circle cx="238" cy="54"  r="2.2"/><circle cx="246" cy="42"  r="2.2"/><circle cx="252" cy="32"  r="2.2"/>
    </g>
    <!-- linear fit goes through the middle, misses curve -->
    <line x1="6" y1="100" x2="254" y2="78" stroke="#2a1a0e" stroke-width="1.4"/>
    <text x="254" y="34" text-anchor="end" class="badge">r = 0.70</text>
  </g>

  <!-- PANEL 3: fan-shaped (heteroscedastic) -->
  <g transform="translate(40,260)">
    <text x="0" y="0" class="ti">3. Fan-shaped (heteroscedastic)</text>
    <text x="0" y="14" class="sm">variance grows with x; model unstable</text>
    <rect x="0" y="20" width="260" height="140" fill="none" stroke="#c8c4c0"/>
    <line x1="0" y1="160" x2="260" y2="160" stroke="#8a8480"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#8a8480"/>
    <g fill="#4a4540" fill-opacity="0.6">
      <circle cx="14"  cy="142" r="2.2"/><circle cx="22"  cy="138" r="2.2"/><circle cx="32"  cy="140" r="2.2"/>
      <circle cx="42"  cy="132" r="2.2"/><circle cx="54"  cy="136" r="2.2"/><circle cx="66"  cy="124" r="2.2"/>
      <circle cx="78"  cy="128" r="2.2"/><circle cx="90"  cy="114" r="2.2"/><circle cx="100" cy="122" r="2.2"/>
      <circle cx="112" cy="106" r="2.2"/><circle cx="124" cy="116" r="2.2"/><circle cx="134" cy="92"  r="2.2"/>
      <circle cx="146" cy="110" r="2.2"/><circle cx="156" cy="80"  r="2.2"/><circle cx="166" cy="100" r="2.2"/>
      <circle cx="176" cy="64"  r="2.2"/><circle cx="186" cy="118" r="2.2"/><circle cx="196" cy="48"  r="2.2"/>
      <circle cx="206" cy="124" r="2.2"/><circle cx="216" cy="36"  r="2.2"/><circle cx="226" cy="130" r="2.2"/>
      <circle cx="236" cy="28"  r="2.2"/><circle cx="246" cy="138" r="2.2"/><circle cx="254" cy="44"  r="2.2"/>
    </g>
    <line x1="6" y1="140" x2="254" y2="60" stroke="#2a1a0e" stroke-width="1.4"/>
    <text x="254" y="34" text-anchor="end" class="badge">r = 0.69</text>
  </g>

  <!-- PANEL 4: linear + extreme outlier -->
  <g transform="translate(360,260)">
    <text x="0" y="0" class="ti">4. Cloud dominated by one outlier</text>
    <text x="0" y="14" class="sm">remove the outlier and r drops to ≈0.3</text>
    <rect x="0" y="20" width="260" height="140" fill="none" stroke="#c8c4c0"/>
    <line x1="0" y1="160" x2="260" y2="160" stroke="#8a8480"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#8a8480"/>
    <g fill="#4a4540" fill-opacity="0.6">
      <circle cx="14"  cy="120" r="2.2"/><circle cx="22"  cy="114" r="2.2"/><circle cx="32"  cy="118" r="2.2"/>
      <circle cx="42"  cy="108" r="2.2"/><circle cx="54"  cy="112" r="2.2"/><circle cx="66"  cy="106" r="2.2"/>
      <circle cx="78"  cy="100" r="2.2"/><circle cx="90"  cy="108" r="2.2"/><circle cx="100" cy="98"  r="2.2"/>
      <circle cx="112" cy="104" r="2.2"/><circle cx="124" cy="96"  r="2.2"/><circle cx="134" cy="100" r="2.2"/>
      <circle cx="146" cy="92"  r="2.2"/><circle cx="156" cy="98"  r="2.2"/><circle cx="166" cy="88"  r="2.2"/>
      <circle cx="176" cy="94"  r="2.2"/><circle cx="186" cy="84"  r="2.2"/><circle cx="196" cy="90"  r="2.2"/>
      <circle cx="206" cy="80"  r="2.2"/><circle cx="216" cy="86"  r="2.2"/><circle cx="226" cy="76"  r="2.2"/>
    </g>
    <!-- the outlier -->
    <circle cx="248" cy="28" r="4" fill="#C8102E"/>
    <text x="248" y="22" text-anchor="middle" class="badge" fill="#C8102E">outlier</text>
    <!-- trend line pulled toward outlier -->
    <line x1="6" y1="124" x2="254" y2="38" stroke="#2a1a0e" stroke-width="1.4"/>
    <text x="254" y="50" text-anchor="end" class="badge">r = 0.70</text>
  </g>

  <text x="350" y="448" text-anchor="middle" class="cap">The same r ≈ 0.7 fits all four. The number summarises; the cloud shows. Always look at the cloud.</text>
</svg>
