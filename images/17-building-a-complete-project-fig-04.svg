<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t17-04 d17-04">
  <title id="t17-04">Phase C deliverables — three questions, three charts, three families</title>
  <desc id="d17-04">Three panels side by side. Panel one is a heatmap of refugee-origin countries by year. Panel two is a horizontal bar chart of destination countries. Panel three is a stacked bar of internal vs international displacement. Each is labelled with the question it answers, its chart family, and its primary channel.</desc>
  <defs>
    <style>
      .ti  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .h2  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #2a1a0e; }
      .lb  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #2a1a0e; }
      .sm  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 9px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
    </style>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>

  <text x="350" y="26" text-anchor="middle" class="ti">Three questions, three charts, three families — the sequence is the project</text>

  <!-- PANEL A: HEATMAP of origins -->
  <g transform="translate(24,52)">
    <rect width="216" height="332" fill="#fdfcfb" stroke="#2a1a0e"/>
    <rect width="216" height="22" fill="#2a1a0e"/>
    <text x="108" y="16" text-anchor="middle" class="h2" fill="#fdfcfb">Q1 · Origins (heatmap)</text>

    <!-- year labels (top) -->
    <g transform="translate(70,38)">
      <text x="0"  y="0" text-anchor="middle" class="sm">'20</text>
      <text x="22" y="0" text-anchor="middle" class="sm">'21</text>
      <text x="44" y="0" text-anchor="middle" class="sm">'22</text>
      <text x="66" y="0" text-anchor="middle" class="sm">'23</text>
      <text x="88" y="0" text-anchor="middle" class="sm">'24</text>
    </g>
    <!-- 6 rows × 5 cols cell grid; cells w=20 h=22; origin x=60, origin y=44 -->
    <!-- countries in order; luminance encoding -->
    <g transform="translate(60,44)">
      <!-- row 1 Syria -->
      <text x="-6" y="14" text-anchor="end" class="sm">Syria</text>
      <rect x="0"  y="0" width="20" height="22" fill="#3a2a1c"/>
      <rect x="22" y="0" width="20" height="22" fill="#2a1a0e"/>
      <rect x="44" y="0" width="20" height="22" fill="#2a1a0e"/>
      <rect x="66" y="0" width="20" height="22" fill="#2a1a0e"/>
      <rect x="88" y="0" width="20" height="22" fill="#1c0e06"/>
      <!-- row 2 Ukraine -->
      <text x="-6" y="38" text-anchor="end" class="sm">Ukraine</text>
      <rect x="0"  y="24" width="20" height="22" fill="#f0ebe3"/>
      <rect x="22" y="24" width="20" height="22" fill="#e0d8cc"/>
      <rect x="44" y="24" width="20" height="22" fill="#1c0e06"/>
      <rect x="66" y="24" width="20" height="22" fill="#2a1a0e"/>
      <rect x="88" y="24" width="20" height="22" fill="#2a1a0e"/>
      <!-- row 3 Afghan -->
      <text x="-6" y="62" text-anchor="end" class="sm">Afghan.</text>
      <rect x="0"  y="48" width="20" height="22" fill="#4a4540"/>
      <rect x="22" y="48" width="20" height="22" fill="#4a4540"/>
      <rect x="44" y="48" width="20" height="22" fill="#3a2a1c"/>
      <rect x="66" y="48" width="20" height="22" fill="#3a2a1c"/>
      <rect x="88" y="48" width="20" height="22" fill="#3a2a1c"/>
      <!-- row 4 Sudan -->
      <text x="-6" y="86" text-anchor="end" class="sm">Sudan</text>
      <rect x="0"  y="72" width="20" height="22" fill="#8a8480"/>
      <rect x="22" y="72" width="20" height="22" fill="#8a8480"/>
      <rect x="44" y="72" width="20" height="22" fill="#6a6058"/>
      <rect x="66" y="72" width="20" height="22" fill="#4a4540"/>
      <rect x="88" y="72" width="20" height="22" fill="#3a2a1c"/>
      <!-- row 5 S. Sudan -->
      <text x="-6" y="110" text-anchor="end" class="sm">S. Sudan</text>
      <rect x="0"  y="96" width="20" height="22" fill="#8a8480"/>
      <rect x="22" y="96" width="20" height="22" fill="#8a8480"/>
      <rect x="44" y="96" width="20" height="22" fill="#8a8480"/>
      <rect x="66" y="96" width="20" height="22" fill="#8a8480"/>
      <rect x="88" y="96" width="20" height="22" fill="#6a6058"/>
      <!-- row 6 Myanmar -->
      <text x="-6" y="134" text-anchor="end" class="sm">Myanmar</text>
      <rect x="0"  y="120" width="20" height="22" fill="#c8c4c0"/>
      <rect x="22" y="120" width="20" height="22" fill="#c8c4c0"/>
      <rect x="44" y="120" width="20" height="22" fill="#8a8480"/>
      <rect x="66" y="120" width="20" height="22" fill="#8a8480"/>
      <rect x="88" y="120" width="20" height="22" fill="#8a8480"/>
    </g>

    <!-- legend strip -->
    <g transform="translate(20,210)">
      <rect x="0"   y="0" width="32" height="8" fill="#f0ebe3"/>
      <rect x="32"  y="0" width="32" height="8" fill="#c8c4c0"/>
      <rect x="64"  y="0" width="32" height="8" fill="#8a8480"/>
      <rect x="96"  y="0" width="32" height="8" fill="#4a4540"/>
      <rect x="128" y="0" width="32" height="8" fill="#2a1a0e"/>
      <text x="0"   y="22" class="sm">low</text>
      <text x="160" y="22" text-anchor="end" class="sm">high</text>
      <text x="80"  y="22" text-anchor="middle" class="sm">refugee count</text>
    </g>

    <!-- footer block -->
    <line x1="10" y1="248" x2="206" y2="248" stroke="#c8c4c0"/>
    <text x="10" y="266" class="h2">Family</text>
    <text x="206" y="266" text-anchor="end" class="lb">heatmap</text>
    <text x="10" y="284" class="h2">Channel</text>
    <text x="206" y="284" text-anchor="end" class="lb">colour luminance</text>
    <text x="10" y="302" class="h2">Sort</text>
    <text x="206" y="302" text-anchor="end" class="lb">by 2024 total ↓</text>
    <text x="10" y="320" class="sm">ranking + change over time</text>
  </g>

  <!-- PANEL B: HORIZONTAL BAR of destinations -->
  <g transform="translate(248,52)">
    <rect width="216" height="332" fill="#fdfcfb" stroke="#2a1a0e"/>
    <rect width="216" height="22" fill="#2a1a0e"/>
    <text x="108" y="16" text-anchor="middle" class="h2" fill="#fdfcfb">Q2 · Destinations (bars)</text>

    <!-- axis line + 0 tick -->
    <line x1="80" y1="42" x2="80" y2="210" stroke="#8a8480"/>
    <line x1="80" y1="210" x2="200" y2="210" stroke="#8a8480"/>
    <text x="80"  y="222" text-anchor="middle" class="sm">0</text>
    <text x="140" y="222" text-anchor="middle" class="sm">3M</text>
    <text x="200" y="222" text-anchor="middle" class="sm">6M</text>

    <!-- 6 rows; y positions 48,76,104,132,160,188; height 20; length scaled to 120px max -->
    <!-- values (approx, millions): Turkey 3.6, Iran 3.4, Germany 2.5, Pakistan 1.7, Uganda 1.5, Poland 1.0 -->
    <g class="sm">
      <text x="74" y="62"  text-anchor="end">Turkey</text>
      <rect x="80" y="48"  width="72" height="20" fill="#2a1a0e"/>
      <text x="156" y="62" class="sm">3.6M</text>

      <text x="74" y="90"  text-anchor="end">Iran</text>
      <rect x="80" y="76"  width="68" height="20" fill="#4a4540"/>
      <text x="152" y="90" class="sm">3.4M</text>

      <text x="74" y="118" text-anchor="end">Germany</text>
      <rect x="80" y="104" width="50" height="20" fill="#4a4540"/>
      <text x="134" y="118" class="sm">2.5M</text>

      <text x="74" y="146" text-anchor="end">Pakistan</text>
      <rect x="80" y="132" width="34" height="20" fill="#8a8480"/>
      <text x="118" y="146" class="sm">1.7M</text>

      <text x="74" y="174" text-anchor="end">Uganda</text>
      <rect x="80" y="160" width="30" height="20" fill="#8a8480"/>
      <text x="114" y="174" class="sm">1.5M</text>

      <text x="74" y="202" text-anchor="end">Poland</text>
      <rect x="80" y="188" width="20" height="20" fill="#c8c4c0"/>
      <text x="104" y="202" class="sm">1.0M</text>
    </g>

    <!-- footer block -->
    <line x1="10" y1="248" x2="206" y2="248" stroke="#c8c4c0"/>
    <text x="10" y="266" class="h2">Family</text>
    <text x="206" y="266" text-anchor="end" class="lb">comparison</text>
    <text x="10" y="284" class="h2">Channel</text>
    <text x="206" y="284" text-anchor="end" class="lb">position from baseline</text>
    <text x="10" y="302" class="h2">Sort</text>
    <text x="206" y="302" text-anchor="end" class="lb">by value ↓ · zero baseline</text>
    <text x="10" y="320" class="sm">ranks the host countries</text>
  </g>

  <!-- PANEL C: STACKED BAR composition -->
  <g transform="translate(472,52)">
    <rect width="204" height="332" fill="#fdfcfb" stroke="#2a1a0e"/>
    <rect width="204" height="22" fill="#2a1a0e"/>
    <text x="102" y="16" text-anchor="middle" class="h2" fill="#fdfcfb">Q3 · Composition (stacked)</text>

    <!-- one horizontal stacked bar, 60% internal / 40% international -->
    <g transform="translate(18,72)">
      <rect x="0"   y="0" width="168" height="36" fill="#2a1a0e"/>
      <rect x="100" y="0" width="68"  height="36" fill="#8a8480"/>
      <!-- labels inside segments -->
      <text x="50"  y="22" text-anchor="middle" class="badge" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="11" fill="#fdfcfb">60% internal</text>
      <text x="134" y="22" text-anchor="middle" class="badge" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="10" fill="#fdfcfb">40% intl.</text>
    </g>

    <!-- legend -->
    <g transform="translate(18,128)">
      <rect x="0" y="0" width="10" height="10" fill="#2a1a0e"/>
      <text x="16" y="9" class="sm">Internal (IDP) — same country</text>
      <rect x="0" y="18" width="10" height="10" fill="#8a8480"/>
      <text x="16" y="27" class="sm">International — cross-border refugees and asylum-seekers</text>
    </g>

    <!-- footer block -->
    <line x1="10" y1="248" x2="194" y2="248" stroke="#c8c4c0"/>
    <text x="10" y="266" class="h2">Family</text>
    <text x="194" y="266" text-anchor="end" class="lb">part-to-whole</text>
    <text x="10" y="284" class="h2">Channel</text>
    <text x="194" y="284" text-anchor="end" class="lb">length proportion</text>
    <text x="10" y="302" class="h2">Form</text>
    <text x="194" y="302" text-anchor="end" class="lb">two-segment stacked</text>
    <text x="10" y="320" class="sm">labels inside segments</text>
  </g>

  <!-- caption -->
  <text x="350" y="436" text-anchor="middle" class="cap">The sequence establishes context (Q1), answers the primary question (Q2), and adds the compositional dimension (Q3).</text>
</svg>
