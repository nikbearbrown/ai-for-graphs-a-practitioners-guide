<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t11-01 d11-01">
  <title id="t11-01">Five-slice vs twelve-slice pie — where the angle channel degrades</title>
  <desc id="d11-01">Two pie charts of the same total. The left pie has five slices, each wedge above 30 degrees and rankable by eye. The right pie has twelve slices, most below 30 degrees and visually indistinguishable.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .onpie { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #fdfcfb; }
    </style>
    <marker id="ar11a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>

  <!-- LEFT PANEL — 5-slice, readable -->
  <text x="32" y="32" class="ti">Five slices — wedges above 30°</text>
  <text x="32" y="48" class="sm">readable angles; ranking visible at a glance</text>

  <!-- Pie: cx 175 cy 220 r 110. Total 100. Order clockwise from 12 o'clock: 56, 21, 14, 6, 3. -->
  <!-- starting angle -π/2; sweeping clockwise -->
  <!-- 56% = 201.6°  → end at 111.6° from start = angle -90 + 201.6 = 111.6  (i.e. at azimuth 111.6 from +x of standard) -->
  <!-- Compute endpoints for each wedge: -->
  <!-- slice1 (56%): start (0,-1)=top  ; end angle from start of -90 sweeping clockwise 201.6° -> azimuth = -90 + 201.6 = 111.6° -->
  <!-- coords: x = 175 + 110 cos(theta), y = 220 + 110 sin(theta) -->
  <!-- theta = -90:  (175,110); theta = 111.6: (175 + 110*cos(111.6), 220 + 110*sin(111.6)) = (175 + 110*-0.368, 220 + 110*0.930) = (134.5, 322.3) -->
  <!-- slice2 (21%): sweep 75.6°  from 111.6 -> 187.2.  end: (175 + 110*cos(187.2), 220 + 110*sin(187.2)) = (175 + 110*-0.992, 220 + 110*-0.125) = (65.9, 206.2) -->
  <!-- slice3 (14%): sweep 50.4°  from 187.2 -> 237.6.  end: cos(237.6)=-0.535, sin(237.6)=-0.845 -> (116.2, 127.0) -->
  <!-- slice4 (6%):  sweep 21.6°  from 237.6 -> 259.2.  end: cos(259.2)=-0.187, sin(259.2)=-0.982 -> (154.4, 112.0) -->
  <!-- slice5 (3%):  sweep 10.8°  from 259.2 -> 270.   end: cos(270)=0, sin(270)=-1 -> (175, 110) -->

  <!-- slice1 56% large arc -->
  <path d="M 175 220 L 175 110 A 110 110 0 1 1 134.5 322.3 Z" fill="#2a1a0e"/>
  <!-- slice2 21% -->
  <path d="M 175 220 L 134.5 322.3 A 110 110 0 0 1 65.9 206.2 Z" fill="#4a4540"/>
  <!-- slice3 14% -->
  <path d="M 175 220 L 65.9 206.2 A 110 110 0 0 1 116.2 127.0 Z" fill="#8a8480"/>
  <!-- slice4 6% -->
  <path d="M 175 220 L 116.2 127.0 A 110 110 0 0 1 154.4 112.0 Z" fill="#a8a4a0"/>
  <!-- slice5 3% -->
  <path d="M 175 220 L 154.4 112.0 A 110 110 0 0 1 175 110 Z" fill="#c8c4c0"/>

  <!-- direct labels on the pie -->
  <text x="175" y="220" text-anchor="middle" class="onpie">Food Security</text>
  <text x="175" y="234" text-anchor="middle" class="onpie">56%</text>
  <text x="118" y="262" text-anchor="middle" class="onpie">Shelter 21%</text>
  <text x="120" y="180" text-anchor="middle" class="onpie">Water 14%</text>

  <!-- callouts pointing out small slices -->
  <text x="195" y="125" class="sm">Health 6%</text>
  <path d="M 192 122 L 162 118" fill="none" stroke="#4a4540" stroke-width="0.75"/>
  <text x="215" y="105" class="sm">Protection 3%</text>
  <path d="M 215 108 L 172 112" fill="none" stroke="#4a4540" stroke-width="0.75"/>

  <!-- annotation for the readable angular range -->
  <path d="M 280 188 L 250 200" fill="none" stroke="#2a1a0e" stroke-dasharray="3 2" marker-end="url(#ar11a)"/>
  <text x="282" y="184" class="lb">readable angular range</text>
  <text x="282" y="198" class="sm">≈ 30°–150° per wedge</text>
  <text x="282" y="212" class="sm">eye can rank these</text>

  <!-- divider -->
  <line x1="350" y1="20" x2="350" y2="430" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- RIGHT PANEL — 12-slice -->
  <text x="370" y="32" class="ti">Twelve slices — most wedges below 30°</text>
  <text x="370" y="48" class="sm">angles too small to rank reliably</text>

  <!-- Pie: cx 525 cy 220 r 110. 12 equal slices of 30° each (8.33% each). -->
  <!-- For visual variety, alternate two grays. Slice colors cycle through palette. -->
  <!-- Angles: each slice 30°, starting at -90 and sweeping clockwise. -->
  <!-- We can render with paths. Compute endpoints for k=0..12: theta_k = -90 + 30*k -->
  <!-- (x_k, y_k) = (525 + 110*cos(theta_k), 220 + 110*sin(theta_k)) -->
  <!-- k=0:  (525, 110) -->
  <!-- k=1:  cos(-60)=0.5, sin(-60)=-0.866 → (580, 124.7) -->
  <!-- k=2:  cos(-30)=0.866, sin(-30)=-0.5 → (620.3, 165) -->
  <!-- k=3:  cos(0)=1, sin(0)=0 → (635, 220) -->
  <!-- k=4:  cos(30)=0.866, sin(30)=0.5 → (620.3, 275) -->
  <!-- k=5:  cos(60)=0.5, sin(60)=0.866 → (580, 315.3) -->
  <!-- k=6:  cos(90)=0, sin(90)=1 → (525, 330) -->
  <!-- k=7:  cos(120)=-0.5, sin(120)=0.866 → (470, 315.3) -->
  <!-- k=8:  cos(150)=-0.866, sin(150)=0.5 → (429.7, 275) -->
  <!-- k=9:  cos(180)=-1, sin(180)=0 → (415, 220) -->
  <!-- k=10: cos(210)=-0.866, sin(210)=-0.5 → (429.7, 165) -->
  <!-- k=11: cos(240)=-0.5, sin(240)=-0.866 → (470, 124.7) -->
  <!-- k=12: back to (525, 110) -->

  <path d="M 525 220 L 525 110 A 110 110 0 0 1 580 124.7 Z" fill="#2a1a0e"/>
  <path d="M 525 220 L 580 124.7 A 110 110 0 0 1 620.3 165 Z" fill="#4a4540"/>
  <path d="M 525 220 L 620.3 165 A 110 110 0 0 1 635 220 Z" fill="#6a625c"/>
  <path d="M 525 220 L 635 220 A 110 110 0 0 1 620.3 275 Z" fill="#8a8480"/>
  <path d="M 525 220 L 620.3 275 A 110 110 0 0 1 580 315.3 Z" fill="#a8a4a0"/>
  <path d="M 525 220 L 580 315.3 A 110 110 0 0 1 525 330 Z" fill="#b8b4b0"/>
  <path d="M 525 220 L 525 330 A 110 110 0 0 1 470 315.3 Z" fill="#c8c4c0"/>
  <path d="M 525 220 L 470 315.3 A 110 110 0 0 1 429.7 275 Z" fill="#a8a4a0"/>
  <path d="M 525 220 L 429.7 275 A 110 110 0 0 1 415 220 Z" fill="#8a8480"/>
  <path d="M 525 220 L 415 220 A 110 110 0 0 1 429.7 165 Z" fill="#6a625c"/>
  <path d="M 525 220 L 429.7 165 A 110 110 0 0 1 470 124.7 Z" fill="#4a4540"/>
  <path d="M 525 220 L 470 124.7 A 110 110 0 0 1 525 110 Z" fill="#3a2d20"/>

  <!-- tiny percentage labels around -->
  <g class="sm">
    <text x="555" y="116" text-anchor="middle">8%</text>
    <text x="608" y="148" text-anchor="middle">8%</text>
    <text x="630" y="200" text-anchor="middle">9%</text>
    <text x="630" y="248" text-anchor="middle">8%</text>
    <text x="608" y="296" text-anchor="middle">8%</text>
    <text x="555" y="326" text-anchor="middle">9%</text>
    <text x="495" y="326" text-anchor="middle">8%</text>
    <text x="442" y="296" text-anchor="middle">8%</text>
    <text x="420" y="248" text-anchor="middle">8%</text>
    <text x="420" y="200" text-anchor="middle">9%</text>
    <text x="442" y="148" text-anchor="middle">8%</text>
    <text x="495" y="116" text-anchor="middle">9%</text>
  </g>

  <!-- callout to the "below threshold" cluster -->
  <path d="M 370 360 L 440 320" fill="none" stroke="#2a1a0e" stroke-dasharray="3 2" marker-end="url(#ar11a)"/>
  <text x="370" y="380" class="lb">all twelve wedges &lt; 30°</text>
  <text x="370" y="394" class="sm">below the threshold of reliable</text>
  <text x="370" y="406" class="sm">angle discrimination</text>

  <!-- caption -->
  <text x="350" y="450" text-anchor="middle" class="cap">The five-slice rule is the point at which the channel's accuracy degrades below useful.</text>
</svg>
