<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t10-03 d10-03">
  <title id="t10-03">Four overplotting strategies for the same 10,000-point cloud</title>
  <desc id="d10-03">Full opacity hides the cloud; alpha transparency reveals density; jittering separates discrete clusters; hexbinning shows density at the cost of individual points.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .badge { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-weight: bold; fill: #2a1a0e; }
    </style>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>
  <text x="350" y="26" text-anchor="middle" class="ti">Same 10,000-point dataset. Four strategies, four different things visible.</text>

  <!-- PANEL 1: full opacity black blob -->
  <g transform="translate(40,60)">
    <text x="0" y="0" class="ti">1. Full opacity</text>
    <text x="0" y="14" class="sm">reveals: nothing · hides: cloud shape, outliers</text>
    <rect x="0" y="20" width="260" height="140" fill="none" stroke="#c8c4c0"/>
    <line x1="0" y1="160" x2="260" y2="160" stroke="#8a8480"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#8a8480"/>
    <!-- approximate solid blob via overlapping ellipses -->
    <g fill="#2a1a0e">
      <ellipse cx="130" cy="92" rx="92" ry="42"/>
      <ellipse cx="105" cy="108" rx="74" ry="28"/>
      <ellipse cx="158" cy="78" rx="64" ry="22"/>
    </g>
    <!-- a few stray outer points -->
    <g fill="#2a1a0e">
      <circle cx="22" cy="148" r="2"/><circle cx="34" cy="138" r="2"/>
      <circle cx="240" cy="42" r="2"/><circle cx="232" cy="56" r="2"/>
      <circle cx="14" cy="42" r="2"/><circle cx="248" cy="148" r="2"/>
    </g>
    <text x="130" y="100" text-anchor="middle" class="badge" fill="#fdfcfb">solid mass</text>
  </g>

  <!-- PANEL 2: alpha 0.15 -->
  <g transform="translate(360,60)">
    <text x="0" y="0" class="ti">2. Alpha transparency (0.15)</text>
    <text x="0" y="14" class="sm">reveals: density, cloud shape, outliers</text>
    <rect x="0" y="20" width="260" height="140" fill="none" stroke="#c8c4c0"/>
    <line x1="0" y1="160" x2="260" y2="160" stroke="#8a8480"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#8a8480"/>
    <!-- overlap many low-alpha ellipses -->
    <g fill="#2a1a0e" fill-opacity="0.18">
      <ellipse cx="130" cy="92" rx="80" ry="36"/>
      <ellipse cx="118" cy="100" rx="60" ry="24"/>
      <ellipse cx="142" cy="84" rx="50" ry="18"/>
      <ellipse cx="130" cy="92" rx="36" ry="12"/>
    </g>
    <!-- scatter points around the periphery -->
    <g fill="#2a1a0e" fill-opacity="0.4">
      <circle cx="22" cy="148" r="1.6"/><circle cx="32" cy="142" r="1.6"/><circle cx="44" cy="136" r="1.6"/>
      <circle cx="58" cy="130" r="1.6"/><circle cx="72" cy="124" r="1.6"/><circle cx="240" cy="42" r="1.6"/>
      <circle cx="232" cy="50" r="1.6"/><circle cx="220" cy="58" r="1.6"/><circle cx="208" cy="66" r="1.6"/>
      <circle cx="14" cy="40" r="1.6"/><circle cx="246" cy="148" r="1.6"/>
      <circle cx="62" cy="36" r="1.6"/><circle cx="86" cy="44" r="1.6"/><circle cx="200" cy="130" r="1.6"/>
    </g>
    <line x1="6" y1="138" x2="254" y2="46" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- PANEL 3: jittered -->
  <g transform="translate(40,260)">
    <text x="0" y="0" class="ti">3. Jittered (discrete data)</text>
    <text x="0" y="14" class="sm">reveals: count at each grid position</text>
    <rect x="0" y="20" width="260" height="140" fill="none" stroke="#c8c4c0"/>
    <line x1="0" y1="160" x2="260" y2="160" stroke="#8a8480"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#8a8480"/>
    <!-- 5x5 jittered clusters of points -->
    <g fill="#4a4540" fill-opacity="0.55">
      <!-- row 1 (low y / high) -->
      <g transform="translate(40,140)">
        <circle cx="0" cy="0" r="2"/><circle cx="4" cy="2" r="2"/><circle cx="-3" cy="-2" r="2"/><circle cx="2" cy="-3" r="2"/>
      </g>
      <g transform="translate(90,130)">
        <circle cx="0" cy="0" r="2"/><circle cx="3" cy="-3" r="2"/><circle cx="-4" cy="2" r="2"/><circle cx="2" cy="4" r="2"/>
        <circle cx="-2" cy="-1" r="2"/><circle cx="4" cy="3" r="2"/>
      </g>
      <g transform="translate(140,110)">
        <circle cx="0" cy="0" r="2"/><circle cx="3" cy="3" r="2"/><circle cx="-3" cy="-3" r="2"/><circle cx="2" cy="-4" r="2"/>
        <circle cx="-4" cy="2" r="2"/><circle cx="4" cy="-1" r="2"/><circle cx="1" cy="4" r="2"/>
      </g>
      <g transform="translate(190,80)">
        <circle cx="0" cy="0" r="2"/><circle cx="3" cy="3" r="2"/><circle cx="-3" cy="-3" r="2"/>
        <circle cx="-2" cy="3" r="2"/><circle cx="4" cy="1" r="2"/>
      </g>
      <g transform="translate(230,50)">
        <circle cx="0" cy="0" r="2"/><circle cx="-3" cy="2" r="2"/><circle cx="3" cy="-1" r="2"/>
      </g>
      <!-- middle band -->
      <g transform="translate(70,100)">
        <circle cx="0" cy="0" r="2"/><circle cx="3" cy="-2" r="2"/><circle cx="-2" cy="3" r="2"/>
      </g>
      <g transform="translate(120,80)">
        <circle cx="0" cy="0" r="2"/><circle cx="3" cy="2" r="2"/><circle cx="-3" cy="-2" r="2"/><circle cx="2" cy="-3" r="2"/>
      </g>
      <g transform="translate(170,60)">
        <circle cx="0" cy="0" r="2"/><circle cx="3" cy="-2" r="2"/><circle cx="-3" cy="2" r="2"/><circle cx="2" cy="3" r="2"/>
      </g>
    </g>
    <text x="40" y="156" text-anchor="middle" class="sm">1</text>
    <text x="90" y="156" text-anchor="middle" class="sm">2</text>
    <text x="140" y="156" text-anchor="middle" class="sm">3</text>
    <text x="190" y="156" text-anchor="middle" class="sm">4</text>
    <text x="230" y="156" text-anchor="middle" class="sm">5</text>
  </g>

  <!-- PANEL 4: hexbin density -->
  <g transform="translate(360,260)">
    <text x="0" y="0" class="ti">4. Hexagonal 2D binning</text>
    <text x="0" y="14" class="sm">reveals: density · hides: individual points</text>
    <rect x="0" y="20" width="260" height="140" fill="none" stroke="#c8c4c0"/>
    <line x1="0" y1="160" x2="260" y2="160" stroke="#8a8480"/>
    <line x1="0" y1="20" x2="0" y2="160" stroke="#8a8480"/>
    <!-- a grid of hexagons with varying luminance -->
    <!-- hex points: center (cx,cy), radius 14 ; flat-top hexagon -->
    <!-- row 1 -->
    <g stroke="#c8c4c0" stroke-width="0.5">
      <polygon points="32,144 39,132 53,132 60,144 53,156 39,156" fill="#e6e2de"/>
      <polygon points="60,124 67,112 81,112 88,124 81,136 67,136" fill="#bfbab5"/>
      <polygon points="88,104 95,92 109,92 116,104 109,116 95,116" fill="#8a8480"/>
      <polygon points="116,84 123,72 137,72 144,84 137,96 123,96" fill="#5a544f"/>
      <polygon points="144,64 151,52 165,52 172,64 165,76 151,76" fill="#3a3530"/>
      <polygon points="172,44 179,32 193,32 200,44 193,56 179,56" fill="#5a544f"/>
      <polygon points="200,30 207,18 221,18 228,30 221,42 207,42" fill="#bfbab5"/>
      <polygon points="32,108 39,96 53,96 60,108 53,120 39,120" fill="#c8c4c0"/>
      <polygon points="60,88 67,76 81,76 88,88 81,100 67,100" fill="#8a8480"/>
      <polygon points="88,68 95,56 109,56 116,68 109,80 95,80" fill="#5a544f"/>
      <polygon points="116,48 123,36 137,36 144,48 137,60 123,60" fill="#3a3530"/>
      <polygon points="144,128 151,116 165,116 172,128 165,140 151,140" fill="#bfbab5"/>
      <polygon points="172,108 179,96 193,96 200,108 193,120 179,120" fill="#8a8480"/>
      <polygon points="200,88 207,76 221,76 228,88 221,100 207,100" fill="#5a544f"/>
      <polygon points="228,68 235,56 249,56 256,68 249,80 235,80" fill="#3a3530"/>
    </g>
    <!-- density legend -->
    <g transform="translate(8,28)">
      <rect x="0" y="0" width="10" height="8" fill="#e6e2de"/>
      <rect x="12" y="0" width="10" height="8" fill="#bfbab5"/>
      <rect x="24" y="0" width="10" height="8" fill="#8a8480"/>
      <rect x="36" y="0" width="10" height="8" fill="#5a544f"/>
      <rect x="48" y="0" width="10" height="8" fill="#3a3530"/>
      <text x="62" y="7" class="sm">low → high count</text>
    </g>
  </g>

  <text x="350" y="448" text-anchor="middle" class="cap">The right strategy depends on what the reader needs to see — points, density, or discrete structure.</text>
</svg>
