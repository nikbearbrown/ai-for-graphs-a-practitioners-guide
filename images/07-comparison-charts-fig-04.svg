<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t04 d04">
  <title id="t04">Horizontal vs vertical bar orientation, governed by label length</title>
  <desc id="d04">Two panels: a vertical column chart with short labels rotated under bars, and a horizontal bar chart with long labels reading left to right.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
    </style>
    <marker id="ar4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>

  <!-- LEFT: VERTICAL COLUMNS, short labels -->
  <g transform="translate(32,40)">
    <text x="0" y="0" class="ti">Vertical columns — short labels (≈ 6 chars)</text>
    <text x="0" y="14" class="sm">Gestalt continuity: eye moves vertically from label to bar tip</text>
    <line x1="40" y1="40" x2="40" y2="280" stroke="#8a8480"/>
    <line x1="40" y1="280" x2="300" y2="280" stroke="#8a8480"/>
    <text x="36" y="283" text-anchor="end" class="sm">0</text>
    <text x="36" y="163" text-anchor="end" class="sm">50</text>
    <text x="36" y="43" text-anchor="end" class="sm">100</text>
    <!-- 6 cols, vals: 88, 76, 64, 52, 41, 29. width 28, gap 8. x start 56 -->
    <g>
      <rect x="56"  y="69.6"  width="28" height="210.4" fill="#2a1a0e"/>
      <rect x="92"  y="98.4"  width="28" height="181.6" fill="#4a4540"/>
      <rect x="128" y="127.2" width="28" height="152.8" fill="#4a4540"/>
      <rect x="164" y="156"   width="28" height="124"   fill="#8a8480"/>
      <rect x="200" y="181.6" width="28" height="98.4"  fill="#8a8480"/>
      <rect x="236" y="210.4" width="28" height="69.6"  fill="#c8c4c0"/>
    </g>
    <!-- rotated short labels -->
    <g class="sm">
      <text x="70"  y="295" text-anchor="end" transform="rotate(-30 70 295)">Boston</text>
      <text x="106" y="295" text-anchor="end" transform="rotate(-30 106 295)">Austin</text>
      <text x="142" y="295" text-anchor="end" transform="rotate(-30 142 295)">Denver</text>
      <text x="178" y="295" text-anchor="end" transform="rotate(-30 178 295)">Tucson</text>
      <text x="214" y="295" text-anchor="end" transform="rotate(-30 214 295)">Tampa</text>
      <text x="250" y="295" text-anchor="end" transform="rotate(-30 250 295)">Reno</text>
    </g>
    <!-- proximity arrow -->
    <path d="M 215 235 L 215 270" fill="none" stroke="#2a1a0e" stroke-dasharray="3 2" marker-end="url(#ar4)"/>
    <text x="222" y="260" class="sm">proximity ↓</text>
  </g>

  <!-- divider -->
  <line x1="350" y1="20" x2="350" y2="420" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- RIGHT: HORIZONTAL BARS, long labels -->
  <g transform="translate(366,40)">
    <text x="0" y="0" class="ti">Horizontal bars — long labels (≈ 22 chars)</text>
    <text x="0" y="14" class="sm">Gestalt proximity: label sits next to its bar, reads left-to-right</text>
    <line x1="148" y1="36" x2="148" y2="280" stroke="#8a8480"/>
    <line x1="148" y1="280" x2="300" y2="280" stroke="#8a8480"/>
    <text x="148" y="295" text-anchor="middle" class="sm">0</text>
    <text x="224" y="295" text-anchor="middle" class="sm">50</text>
    <text x="300" y="295" text-anchor="middle" class="sm">100</text>
    <!-- 6 rows, vals: 88, 76, 64, 52, 41, 29; bar length = val * 1.52 -->
    <!-- y positions: 44, 80, 116, 152, 188, 224 (height 26) -->
    <g>
      <rect x="148" y="44"  width="133.76" height="26" fill="#2a1a0e"/>
      <rect x="148" y="80"  width="115.52" height="26" fill="#4a4540"/>
      <rect x="148" y="116" width="97.28"  height="26" fill="#4a4540"/>
      <rect x="148" y="152" width="79.04"  height="26" fill="#8a8480"/>
      <rect x="148" y="188" width="62.32"  height="26" fill="#8a8480"/>
      <rect x="148" y="224" width="44.08"  height="26" fill="#c8c4c0"/>
    </g>
    <g class="sm">
      <text x="142" y="60"  text-anchor="end">Boston Metropolitan Area</text>
      <text x="142" y="96"  text-anchor="end">Greater Austin Region</text>
      <text x="142" y="132" text-anchor="end">Denver-Aurora Metro</text>
      <text x="142" y="168" text-anchor="end">Tucson-South Arizona</text>
      <text x="142" y="204" text-anchor="end">Tampa Bay Region</text>
      <text x="142" y="240" text-anchor="end">Reno-Sparks Area</text>
    </g>
    <!-- proximity arrow -->
    <path d="M 100 60 L 145 60" fill="none" stroke="#2a1a0e" stroke-dasharray="3 2" marker-end="url(#ar4)"/>
    <text x="80" y="76" class="sm">proximity →</text>
  </g>

  <!-- decision rule box -->
  <g transform="translate(32,350)">
    <rect width="636" height="64" fill="#f5f2ee" stroke="#2a1a0e"/>
    <text x="16" y="22" class="ti">Decision rule</text>
    <text x="16" y="40" class="lb">If the longest category label exceeds 10–12 characters → horizontal bars.</text>
    <text x="16" y="56" class="lb">If categories exceed ~15 → horizontal bars, top-N, or treemap.</text>
  </g>
  <text x="350" y="440" text-anchor="middle" class="cap">Orientation is not aesthetic. It is a question of which Gestalt principles the layout can preserve.</text>
</svg>
