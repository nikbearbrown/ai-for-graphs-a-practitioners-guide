<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="t08-04 d08-04">
  <title id="t08-04">Compressed axis vs gap-marked axis for a missing month</title>
  <desc id="d08-04">Two panels of a monthly time series with March 2021 missing. The left compresses February next to April, fabricating a steeper slope. The right preserves the calendar position and breaks the line across the gap.</desc>
  <defs>
    <style>
      .ti  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
    </style>
    <marker id="ar8-04" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="440" fill="#fdfcfb"/>
  <text x="350" y="26" text-anchor="middle" class="ti">Same data, missing March 2021. Left compresses the gap; right preserves it.</text>

  <!-- 24 months of dummy data with March 2021 missing -->
  <!-- index: 0..23 → Jan20..Dec21; missing index 14 (Mar21) -->
  <!-- values, length 24, with Mar21 absent. Use steady rise: Jan20=40, Feb20=42, Mar20=46, ... -->

  <!-- LEFT PANEL — COMPRESSED -->
  <g transform="translate(20,60)">
    <text x="0" y="0" class="ti">Compressed axis (March 2021 omitted)</text>
    <text x="0" y="16" class="sm">Feb 2021 sits adjacent to Apr 2021 — the slope is fabricated</text>
    <!-- axis box -->
    <line x1="40" y1="40" x2="40" y2="240" stroke="#8a8480"/>
    <line x1="40" y1="240" x2="320" y2="240" stroke="#8a8480"/>
    <text x="36" y="243" text-anchor="end" class="sm">0</text>
    <text x="36" y="143" text-anchor="end" class="sm">50</text>
    <text x="36" y="43" text-anchor="end" class="sm">100</text>
    <line x1="38" y1="240" x2="40" y2="240" stroke="#4a4540"/>
    <line x1="38" y1="143" x2="40" y2="143" stroke="#4a4540"/>
    <line x1="38" y1="43" x2="40" y2="43" stroke="#4a4540"/>
    <!-- 23 points evenly spaced across 280px → step ≈ 12.17 -->
    <!-- value sequence with Mar21 dropped (23 values).
         Jan20..Dec20: 40 42 46 50 55 58 60 64 66 68 70 72
         Jan21..Dec21 (no Mar): 70 70   76 78 80 84 88 90 92 95 97
         y = 240 - v*1.97 (scale 0..100 → 197px) -->
    <polyline points="50,161.2 62.17,157.3 74.34,149.4 86.51,141.5 98.68,131.7 110.85,125.8 123.02,121.9 135.19,114.0 147.36,110.1 159.53,106.2 171.7,102.3 183.87,98.4 196.04,102.3 208.21,102.3 220.38,90.6 232.55,86.7 244.72,82.8 256.89,74.9 269.06,67.0 281.23,63.1 293.4,59.2 305.57,53.3 317.74,49.4"
              fill="none" stroke="#2a1a0e" stroke-width="1.4"/>
    <!-- highlight artificially-steep segment Feb21→Apr21 (indices 13→14 in compressed list, x = 208.21 → 220.38) -->
    <line x1="208.21" y1="102.3" x2="220.38" y2="90.6" stroke="#c8860e" stroke-width="2.5"/>
    <!-- labels for month axis -->
    <g class="sm">
      <text x="50" y="258" text-anchor="middle">Jan&apos;20</text>
      <text x="135.19" y="258" text-anchor="middle">Aug&apos;20</text>
      <text x="208.21" y="258" text-anchor="middle">Feb&apos;21</text>
      <text x="220.38" y="270" text-anchor="middle">Apr&apos;21</text>
      <text x="317.74" y="258" text-anchor="middle">Dec&apos;21</text>
    </g>
    <!-- arrow showing fake slope -->
    <path d="M 270 60 L 220 88" fill="none" stroke="#2a1a0e" stroke-dasharray="3 2" marker-end="url(#ar8-04)"/>
    <text x="276" y="58" class="sm">fake slope</text>
    <text x="276" y="70" class="sm">2-month gap drawn as 1</text>
  </g>

  <!-- RIGHT PANEL — GAP-MARKED -->
  <g transform="translate(360,60)">
    <text x="0" y="0" class="ti">Gap-marked axis (March 2021 held in place)</text>
    <text x="0" y="16" class="sm">line breaks across the missing month — slope is correct on either side</text>
    <line x1="40" y1="40" x2="40" y2="240" stroke="#8a8480"/>
    <line x1="40" y1="240" x2="320" y2="240" stroke="#8a8480"/>
    <text x="36" y="243" text-anchor="end" class="sm">0</text>
    <text x="36" y="143" text-anchor="end" class="sm">50</text>
    <text x="36" y="43" text-anchor="end" class="sm">100</text>
    <line x1="38" y1="240" x2="40" y2="240" stroke="#4a4540"/>
    <line x1="38" y1="143" x2="40" y2="143" stroke="#4a4540"/>
    <line x1="38" y1="43" x2="40" y2="43" stroke="#4a4540"/>
    <!-- 24 calendar slots; step = 280/23 ≈ 12.17. Same values; Mar21 (index 14) blank. -->
    <!-- points list (full 24 — index 14 omitted): -->
    <!-- index→x: 50, 62.17, 74.34, 86.51, 98.68, 110.85, 123.02, 135.19, 147.36, 159.53, 171.7, 183.87, 196.04, 208.21, 220.38(SKIP), 232.55, 244.72, 256.89, 269.06, 281.23, 293.4, 305.57, 317.74 -->
    <!-- values (excluding skipped index 14): same sequence; reach Apr21 at index 15 -->
    <!-- segment 1 (Jan20..Feb21 idx 0..13) -->
    <polyline points="50,161.2 62.17,157.3 74.34,149.4 86.51,141.5 98.68,131.7 110.85,125.8 123.02,121.9 135.19,114.0 147.36,110.1 159.53,106.2 171.7,102.3 183.87,98.4 196.04,102.3 208.21,102.3"
              fill="none" stroke="#2a1a0e" stroke-width="1.4"/>
    <!-- gap region at index 14 (x = 220.38) -->
    <rect x="214.3" y="40" width="12.17" height="200" fill="#c8c4c0" fill-opacity="0.45"/>
    <!-- dotted segment across gap -->
    <line x1="208.21" y1="102.3" x2="232.55" y2="90.6" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- segment 2 (Apr21..Dec21 idx 15..23) -->
    <polyline points="232.55,90.6 244.72,86.7 256.89,82.8 269.06,74.9 281.23,67.0 293.4,63.1 305.57,59.2 317.74,49.4"
              fill="none" stroke="#2a1a0e" stroke-width="1.4"/>
    <!-- gap label -->
    <text x="220.38" y="56" text-anchor="middle" class="sm">data</text>
    <text x="220.38" y="68" text-anchor="middle" class="sm">missing</text>
    <!-- month axis -->
    <g class="sm">
      <text x="50" y="258" text-anchor="middle">Jan&apos;20</text>
      <text x="135.19" y="258" text-anchor="middle">Aug&apos;20</text>
      <text x="208.21" y="258" text-anchor="middle">Feb&apos;21</text>
      <text x="220.38" y="270" text-anchor="middle">Mar&apos;21</text>
      <text x="232.55" y="258" text-anchor="middle">Apr&apos;21</text>
      <text x="317.74" y="258" text-anchor="middle">Dec&apos;21</text>
    </g>
    <!-- correct slope annotation -->
    <path d="M 270 60 L 234 92" fill="none" stroke="#2a1a0e" stroke-dasharray="3 2" marker-end="url(#ar8-04)"/>
    <text x="276" y="58" class="sm">slope reflects</text>
    <text x="276" y="70" class="sm">2-month change</text>
  </g>

  <!-- slope angle annotation under both -->
  <g transform="translate(20,330)">
    <text x="0" y="0" class="ti">Slope angle (Feb→Apr 2021)</text>
    <text x="0" y="16" class="sm">Compressed left: drawn at the steeper one-month angle (~44°)</text>
    <text x="0" y="30" class="sm">Gap-marked right: drawn at the gentler two-month angle (~26°)</text>
    <text x="0" y="48" class="lb">The Gestalt principle of continuity rewards the eye — and lies about the rate of change.</text>
  </g>

  <text x="350" y="420" text-anchor="middle" class="cap">Don&apos;t-skip-intervals rule: keep calendar position; break the line where data is absent; never let the axis pretend a gap closed.</text>
</svg>
