<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t14-04 d14-04">
  <title id="t14-04">Snow's Soho — choropleth aggregation hides the cluster a dot map reveals</title>
  <desc id="d14-04">Two panels of the same 1854 cholera dataset. Left: parish-level choropleth; the cluster around Broad Street is dissolved into a moderate parish total. Right: dot-per-death map; the cluster around the Broad Street pump is immediately visible.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .street { stroke: #c8c4c0; stroke-width: 0.75; fill: none; }
      .parish { stroke: #4a4540; stroke-width: 1; }
    </style>
    <marker id="ar14-04" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#fdfcfb"/>

  <!-- LEFT: CHOROPLETH -->
  <text x="32" y="28" class="ti">Parish choropleth — same data, aggregated</text>
  <text x="32" y="44" class="sm">deaths per parish · resolution = parish boundary</text>

  <g transform="translate(40,64)">
    <!-- Three parishes -->
    <path class="parish" d="M 0 0 L 130 0 L 145 80 L 0 110 Z" fill="#c8c4c0"/>
    <path class="parish" d="M 130 0 L 280 0 L 295 90 L 145 80 Z" fill="#8a8480"/>
    <path class="parish" d="M 0 110 L 145 80 L 295 90 L 295 230 L 0 230 Z" fill="#c8c4c0"/>
    <!-- Parish labels -->
    <text x="60"  y="55" class="sm" fill="#fdfcfb">St James</text>
    <text x="60"  y="68" class="sm" fill="#fdfcfb">(34 deaths)</text>
    <text x="195" y="45" class="lb" fill="#fdfcfb">St Anne (Soho)</text>
    <text x="195" y="60" class="sm" fill="#fdfcfb">(72 deaths)</text>
    <text x="120" y="170" class="sm">Westminster</text>
    <text x="120" y="184" class="sm">(28 deaths)</text>
  </g>

  <!-- Legend left -->
  <g transform="translate(40,318)">
    <text x="0" y="0" class="sm">low</text>
    <rect x="22" y="-9" width="18" height="11" fill="#ece8e3" stroke="#fdfcfb"/>
    <rect x="40" y="-9" width="18" height="11" fill="#c8c4c0" stroke="#fdfcfb"/>
    <rect x="58" y="-9" width="18" height="11" fill="#8a8480" stroke="#fdfcfb"/>
    <rect x="76" y="-9" width="18" height="11" fill="#4a4540" stroke="#fdfcfb"/>
    <rect x="94" y="-9" width="18" height="11" fill="#2a1a0e" stroke="#fdfcfb"/>
    <text x="118" y="0" class="sm">high</text>
    <text x="0" y="16" class="sm">deaths per parish (binned)</text>
  </g>

  <!-- Annotation left -->
  <path d="M 200 332 L 230 280 L 200 165" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar14-04)"/>
  <text x="170" y="350" text-anchor="start" class="lb">St Anne looks moderately affected</text>
  <text x="170" y="365" text-anchor="start" class="sm">— but the cluster is sub-parish</text>

  <!-- divider -->
  <line x1="380" y1="16" x2="380" y2="424" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- RIGHT: DOT MAP -->
  <text x="400" y="28" class="ti">Dot map — one dot per death at its address</text>
  <text x="400" y="44" class="sm">point-level data · resolution = street</text>

  <g transform="translate(408,64)">
    <!-- street grid -->
    <rect x="0" y="0" width="295" height="230" fill="#fdfcfb" stroke="#c8c4c0"/>
    <g class="street">
      <line x1="0" y1="40" x2="295" y2="40"/>
      <line x1="0" y1="90" x2="295" y2="90"/>
      <line x1="0" y1="140" x2="295" y2="140"/>
      <line x1="0" y1="190" x2="295" y2="190"/>
      <line x1="50" y1="0" x2="50" y2="230"/>
      <line x1="110" y1="0" x2="110" y2="230"/>
      <line x1="170" y1="0" x2="170" y2="230"/>
      <line x1="230" y1="0" x2="230" y2="230"/>
    </g>
    <!-- Street labels -->
    <text x="6" y="86" class="sm">Cambridge St</text>
    <text x="172" y="36" class="sm">Broad St</text>
    <!-- Dense cluster around (140, 115) — the Broad Street pump area -->
    <g fill="#2a1a0e">
      <circle cx="120" cy="100" r="2"/><circle cx="125" cy="108" r="2"/>
      <circle cx="118" cy="115" r="2"/><circle cx="130" cy="115" r="2"/>
      <circle cx="140" cy="108" r="2"/><circle cx="148" cy="115" r="2"/>
      <circle cx="135" cy="120" r="2"/><circle cx="128" cy="125" r="2"/>
      <circle cx="120" cy="128" r="2"/><circle cx="142" cy="128" r="2"/>
      <circle cx="150" cy="120" r="2"/><circle cx="155" cy="108" r="2"/>
      <circle cx="115" cy="92" r="2"/><circle cx="138" cy="95" r="2"/>
      <circle cx="148" cy="98" r="2"/><circle cx="160" cy="118" r="2"/>
      <circle cx="125" cy="135" r="2"/><circle cx="135" cy="138" r="2"/>
      <circle cx="118" cy="105" r="2"/><circle cx="132" cy="102" r="2"/>
      <circle cx="142" cy="118" r="2"/><circle cx="128" cy="92" r="2"/>
      <circle cx="155" cy="125" r="2"/><circle cx="145" cy="105" r="2"/>
      <circle cx="158" cy="100" r="2"/><circle cx="122" cy="120" r="2"/>
      <circle cx="148" cy="125" r="2"/><circle cx="140" cy="118" r="2"/>
    </g>
    <!-- Sparse dots elsewhere -->
    <g fill="#4a4540">
      <circle cx="22" cy="20" r="1.6"/><circle cx="40" cy="68" r="1.6"/>
      <circle cx="62" cy="32" r="1.6"/><circle cx="78" cy="68" r="1.6"/>
      <circle cx="92" cy="22" r="1.6"/><circle cx="200" cy="50" r="1.6"/>
      <circle cx="218" cy="78" r="1.6"/><circle cx="240" cy="32" r="1.6"/>
      <circle cx="262" cy="64" r="1.6"/><circle cx="60" cy="160" r="1.6"/>
      <circle cx="80" cy="200" r="1.6"/><circle cx="32" cy="180" r="1.6"/>
      <circle cx="210" cy="160" r="1.6"/><circle cx="240" cy="200" r="1.6"/>
      <circle cx="195" cy="210" r="1.6"/><circle cx="265" cy="180" r="1.6"/>
      <circle cx="20" cy="120" r="1.6"/><circle cx="280" cy="120" r="1.6"/>
      <circle cx="190" cy="100" r="1.6"/><circle cx="225" cy="115" r="1.6"/>
    </g>
    <!-- pump marker -->
    <circle cx="140" cy="115" r="8" fill="none" stroke="#c8860e" stroke-width="2"/>
    <text x="140" y="155" text-anchor="middle" class="lb">Broad Street pump</text>
  </g>

  <!-- Annotation right -->
  <path d="M 600 332 L 580 200 L 560 180" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar14-04)"/>
  <text x="612" y="350" text-anchor="end" class="lb">cluster is sub-block</text>
  <text x="612" y="365" text-anchor="end" class="sm">— pump is at the dense core</text>

  <!-- caption -->
  <text x="380" y="418" text-anchor="middle" class="cap">The form that answers the question is set by the resolution the question requires. Parishes can't see street blocks.</text>
</svg>
