<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t14-02 d14-02">
  <title id="t14-02">Four spatial forms — choropleth, dot density, bubble, connection</title>
  <desc id="d14-02">Reference grid of four geographic chart forms. Each panel names the form, shows a thumbnail of its visual structure, identifies the primary channel, and states the use case.</desc>
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: bold; fill: #2a1a0e; letter-spacing: 0.5px; }
      .ti   { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb   { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm   { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .frame { fill: #fdfcfb; stroke: #c8c4c0; stroke-width: 1; }
      .tile  { fill: #f4f1ec; stroke: #c8c4c0; stroke-width: 0.5; }
    </style>
  </defs>
  <rect width="760" height="460" fill="#fdfcfb"/>
  <text x="380" y="26" text-anchor="middle" class="ti">Four geographic forms. The data type and the reader's question choose the form.</text>

  <!-- Panel A: CHOROPLETH -->
  <g transform="translate(32,52)">
    <rect class="frame" x="0" y="0" width="340" height="180"/>
    <text x="14" y="22" class="mono">CHOROPLETH</text>
    <!-- thumbnail: 3x4 tiles shaded -->
    <g transform="translate(14,36)">
      <rect class="tile" x="0"  y="0"  width="30" height="22" fill="#ece8e3"/>
      <rect class="tile" x="32" y="0"  width="30" height="22" fill="#c8c4c0"/>
      <rect class="tile" x="64" y="0"  width="30" height="22" fill="#8a8480"/>
      <rect class="tile" x="96" y="0"  width="30" height="22" fill="#4a4540"/>
      <rect class="tile" x="0"  y="24" width="30" height="22" fill="#c8c4c0"/>
      <rect class="tile" x="32" y="24" width="30" height="22" fill="#8a8480"/>
      <rect class="tile" x="64" y="24" width="30" height="22" fill="#4a4540"/>
      <rect class="tile" x="96" y="24" width="30" height="22" fill="#2a1a0e"/>
      <rect class="tile" x="0"  y="48" width="30" height="22" fill="#ece8e3"/>
      <rect class="tile" x="32" y="48" width="30" height="22" fill="#c8c4c0"/>
      <rect class="tile" x="64" y="48" width="30" height="22" fill="#8a8480"/>
      <rect class="tile" x="96" y="48" width="30" height="22" fill="#4a4540"/>
    </g>
    <!-- meta -->
    <text x="160" y="50" class="lb">channel: color luminance</text>
    <text x="160" y="68" class="sm">mark = region polygon</text>
    <text x="160" y="86" class="sm">value encoded as fill</text>
    <text x="14" y="132" class="lb">USE WHEN</text>
    <text x="14" y="150" class="sm">rate data (per capita, percent)</text>
    <text x="14" y="166" class="sm">comparable-area regions</text>
  </g>

  <!-- Panel B: DOT DENSITY -->
  <g transform="translate(388,52)">
    <rect class="frame" x="0" y="0" width="340" height="180"/>
    <text x="14" y="22" class="mono">DOT DENSITY</text>
    <!-- thumbnail: dots clustered around a point, sparse elsewhere -->
    <g transform="translate(14,36)">
      <rect class="tile" x="0" y="0" width="128" height="70" fill="#fdfcfb"/>
      <!-- street grid hint -->
      <line x1="0" y1="35" x2="128" y2="35" stroke="#c8c4c0" stroke-width="0.5"/>
      <line x1="64" y1="0" x2="64" y2="70" stroke="#c8c4c0" stroke-width="0.5"/>
      <!-- cluster around (64,35) -->
      <g fill="#2a1a0e">
        <circle cx="60" cy="33" r="1.5"/><circle cx="65" cy="35" r="1.5"/>
        <circle cx="63" cy="38" r="1.5"/><circle cx="58" cy="37" r="1.5"/>
        <circle cx="67" cy="32" r="1.5"/><circle cx="61" cy="40" r="1.5"/>
        <circle cx="55" cy="34" r="1.5"/><circle cx="69" cy="37" r="1.5"/>
        <circle cx="62" cy="30" r="1.5"/><circle cx="66" cy="40" r="1.5"/>
        <circle cx="58" cy="40" r="1.5"/><circle cx="70" cy="34" r="1.5"/>
      </g>
      <!-- sparse dots -->
      <g fill="#4a4540">
        <circle cx="15" cy="14" r="1.3"/><circle cx="22" cy="55" r="1.3"/>
        <circle cx="100" cy="20" r="1.3"/><circle cx="112" cy="56" r="1.3"/>
        <circle cx="38" cy="62" r="1.3"/><circle cx="90" cy="10" r="1.3"/>
      </g>
      <!-- marker for the pump -->
      <circle cx="63" cy="35" r="5" fill="none" stroke="#c8860e" stroke-width="1.5"/>
    </g>
    <text x="160" y="50" class="lb">channel: point count</text>
    <text x="160" y="68" class="sm">mark = single point per event</text>
    <text x="160" y="86" class="sm">no area encoding at all</text>
    <text x="14" y="132" class="lb">USE WHEN</text>
    <text x="14" y="150" class="sm">absolute count at point level</text>
    <text x="14" y="166" class="sm">sub-region spatial pattern matters</text>
  </g>

  <!-- Panel C: BUBBLE MAP -->
  <g transform="translate(32,248)">
    <rect class="frame" x="0" y="0" width="340" height="180"/>
    <text x="14" y="22" class="mono">BUBBLE MAP</text>
    <g transform="translate(14,36)">
      <rect class="tile" x="0" y="0" width="128" height="70" fill="#fdfcfb"/>
      <!-- schematic country outlines (simple polygons) -->
      <path d="M 8 12 L 38 8 L 50 18 L 44 30 L 18 32 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <path d="M 54 14 L 80 10 L 92 24 L 76 38 L 56 30 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <path d="M 96 16 L 122 14 L 118 38 L 100 36 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <path d="M 12 38 L 42 38 L 50 56 L 22 60 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <path d="M 56 42 L 82 42 L 88 60 L 60 64 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <!-- bubbles at centroids, sized sqrt -->
      <circle cx="28" cy="20" r="10" fill="#2a1a0e" fill-opacity="0.55" stroke="#2a1a0e"/>
      <circle cx="72" cy="22" r="6"  fill="#2a1a0e" fill-opacity="0.55" stroke="#2a1a0e"/>
      <circle cx="108" cy="26" r="3" fill="#2a1a0e" fill-opacity="0.55" stroke="#2a1a0e"/>
      <circle cx="30" cy="48" r="4"  fill="#2a1a0e" fill-opacity="0.55" stroke="#2a1a0e"/>
      <circle cx="70" cy="52" r="8"  fill="#2a1a0e" fill-opacity="0.55" stroke="#2a1a0e"/>
    </g>
    <text x="160" y="50" class="lb">channel: circle area</text>
    <text x="160" y="68" class="sm">mark = circle at centroid</text>
    <text x="160" y="86" class="sm">d3.scaleSqrt for radius</text>
    <text x="14" y="132" class="lb">USE WHEN</text>
    <text x="14" y="150" class="sm">absolute magnitude per region</text>
    <text x="14" y="166" class="sm">need to sever area distortion</text>
  </g>

  <!-- Panel D: CONNECTION / FLOW MAP -->
  <g transform="translate(388,248)">
    <rect class="frame" x="0" y="0" width="340" height="180"/>
    <text x="14" y="22" class="mono">CONNECTION · FLOW</text>
    <g transform="translate(14,36)">
      <rect class="tile" x="0" y="0" width="128" height="70" fill="#fdfcfb"/>
      <!-- schematic continents -->
      <path d="M 8 14 L 36 10 L 48 22 L 30 36 L 12 28 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <path d="M 56 22 L 86 18 L 96 38 L 74 44 L 60 36 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <path d="M 102 14 L 122 18 L 116 36 L 104 34 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <path d="M 14 44 L 38 50 L 30 62 L 18 60 Z" fill="#f4f1ec" stroke="#c8c4c0"/>
      <!-- origin nodes -->
      <circle cx="26" cy="22" r="2" fill="#2a1a0e"/>
      <circle cx="76" cy="30" r="2" fill="#2a1a0e"/>
      <circle cx="112" cy="24" r="2" fill="#2a1a0e"/>
      <circle cx="24" cy="54" r="2" fill="#2a1a0e"/>
      <!-- flows: thicker = bigger -->
      <path d="M 26 22 Q 50 4 76 30"  fill="none" stroke="#2a1a0e" stroke-width="2.5" opacity="0.7"/>
      <path d="M 76 30 Q 90 12 112 24" fill="none" stroke="#2a1a0e" stroke-width="1.5" opacity="0.7"/>
      <path d="M 24 54 Q 50 36 76 30"  fill="none" stroke="#2a1a0e" stroke-width="1"   opacity="0.7"/>
    </g>
    <text x="160" y="50" class="lb">channel: line width</text>
    <text x="160" y="68" class="sm">mark = line between locations</text>
    <text x="160" y="86" class="sm">top-N filter for spaghetti</text>
    <text x="14" y="132" class="lb">USE WHEN</text>
    <text x="14" y="150" class="sm">origin–destination data</text>
    <text x="14" y="166" class="sm">flow magnitude or existence</text>
  </g>

  <text x="380" y="450" text-anchor="middle" class="cap">The form is determined by the data type and the question — not by what looks impressive.</text>
</svg>
