<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t14-03 d14-03">
  <title id="t14-03">Every country at the same value — the area-size distortion is preattentive</title>
  <desc id="d14-03">Schematic world choropleth in Equal Earth projection. Every country is filled with the identical mid-range luminance. The visual story is still dominated by land area because area is processed before color.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .land { fill: #8a8480; stroke: #fdfcfb; stroke-width: 0.6; }
    </style>
    <marker id="ar14-03" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#fdfcfb"/>
  <text x="380" y="28" text-anchor="middle" class="ti">Every country has the same value. The eye still moves to the big ones.</text>
  <text x="380" y="44" text-anchor="middle" class="sm">Equal Earth projection · single fill across all polygons</text>

  <!-- Schematic Equal-Earth-ish world: hand-shaped continents -->
  <!-- North America (large) -->
  <path class="land" d="M 60 130 Q 90 100 150 95 Q 200 100 230 120 L 235 165 Q 220 200 180 215 Q 130 220 95 200 Q 70 175 60 130 Z"/>
  <!-- Greenland (smaller on Equal Earth) -->
  <path class="land" d="M 230 95 Q 250 88 268 95 Q 270 115 258 125 Q 240 122 232 110 Z"/>
  <!-- South America -->
  <path class="land" d="M 200 235 Q 220 230 240 240 L 245 290 Q 235 340 215 360 Q 195 350 188 310 Q 188 270 200 235 Z"/>
  <!-- Africa (huge — 14× Greenland) -->
  <path class="land" d="M 350 175 Q 395 165 430 175 Q 445 200 442 240 Q 432 285 408 320 Q 380 330 360 310 Q 340 270 340 230 Q 340 195 350 175 Z"/>
  <!-- Europe -->
  <path class="land" d="M 350 130 Q 400 120 440 130 Q 450 155 430 170 Q 390 168 360 160 Q 348 145 350 130 Z"/>
  <!-- Asia (huge) -->
  <path class="land" d="M 445 110 Q 510 95 590 105 Q 640 115 660 140 Q 655 175 615 195 Q 560 205 510 195 Q 470 185 450 165 Q 440 140 445 110 Z"/>
  <!-- Russia is part of Asia tail (extends west to overlap Europe) -->
  <path class="land" d="M 450 100 Q 530 90 620 95 Q 650 95 660 110 Q 640 125 580 130 Q 510 130 460 125 Q 444 115 450 100 Z"/>
  <!-- India peninsula -->
  <path class="land" d="M 510 195 Q 525 215 535 240 Q 525 255 512 240 Q 505 215 510 195 Z"/>
  <!-- Southeast Asia / Indonesia -->
  <path class="land" d="M 580 220 Q 615 215 640 230 Q 635 245 610 250 Q 585 245 580 220 Z"/>
  <!-- Australia -->
  <path class="land" d="M 590 290 Q 640 282 680 295 Q 680 320 650 330 Q 615 328 595 318 Q 585 305 590 290 Z"/>
  <!-- Antarctica band -->
  <path class="land" d="M 100 385 L 700 385 L 690 405 L 110 405 Z"/>

  <!-- Single-value legend -->
  <g transform="translate(60,380)">
    <rect x="0" y="0" width="40" height="14" fill="#8a8480" stroke="#fdfcfb"/>
    <text x="48" y="11" class="sm">all countries: same value (mid-range luminance)</text>
  </g>

  <!-- Annotation: Russia, Canada, Australia draw the eye -->
  <path d="M 540 60 L 560 80 L 560 105" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar14-03)"/>
  <text x="540" y="56" text-anchor="middle" class="lb">Russia · visually dominant</text>
  <path d="M 150 60 L 140 78 L 130 105" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar14-03)"/>
  <text x="150" y="56" text-anchor="middle" class="lb">Canada · visually dominant</text>
  <path d="M 720 280 L 700 295 L 680 305" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar14-03)"/>
  <text x="720" y="275" text-anchor="end" class="lb">Australia · visually dominant</text>

  <!-- Greenland annotation -->
  <path d="M 290 70 L 270 88 L 252 100" fill="none" stroke="#c8860e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar14-03)"/>
  <text x="290" y="66" text-anchor="start" class="lb">Greenland · small on Equal Earth</text>

  <!-- Luxembourg invisible -->
  <text x="410" y="118" class="sm">·</text>
  <path d="M 480 75 L 450 95 L 418 118" fill="none" stroke="#c8860e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar14-03)"/>
  <text x="482" y="71" text-anchor="start" class="lb">Luxembourg · invisible at any encoding</text>

  <!-- caption -->
  <text x="380" y="426" text-anchor="middle" class="cap">Area is preattentive. Color is not. The choropleth's color encoding cannot override what the eye reads first.</text>
</svg>
