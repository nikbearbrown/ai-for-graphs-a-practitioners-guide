<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="t15-1 d15-1">
  <title id="t15-1">Candlestick anatomy versus a closing-price line chart</title>
  <desc id="d15-1">Left panel shows one candlestick annotated with open, high, low, close, body, and wicks. Right panel shows a line chart of closing prices for the same period — four variables per glyph versus one.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
    </style>
    <marker id="ar1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="440" fill="#fdfcfb"/>

  <!-- LEFT PANEL: annotated candlestick -->
  <text x="32" y="32" class="ti">A. One candlestick — four values encoded with position</text>
  <text x="32" y="48" class="sm">Body spans open→close; wicks reach high above, low below; color encodes direction.</text>

  <!-- price axis (vertical) -->
  <line x1="180" y1="80" x2="180" y2="340" stroke="#8a8480" stroke-width="1"/>
  <line x1="178" y1="92"  x2="180" y2="92"  stroke="#4a4540"/>
  <line x1="178" y1="160" x2="180" y2="160" stroke="#4a4540"/>
  <line x1="178" y1="228" x2="180" y2="228" stroke="#4a4540"/>
  <line x1="178" y1="296" x2="180" y2="296" stroke="#4a4540"/>
  <line x1="178" y1="340" x2="180" y2="340" stroke="#4a4540"/>
  <text x="174" y="95"  text-anchor="end" class="sm">120</text>
  <text x="174" y="163" text-anchor="end" class="sm">115</text>
  <text x="174" y="231" text-anchor="end" class="sm">110</text>
  <text x="174" y="299" text-anchor="end" class="sm">105</text>
  <text x="174" y="343" text-anchor="end" class="sm">100</text>

  <!-- UP CANDLE  open 107 close 117 high 119 low 104 → y(p) = 92 + (120-p)*49.6 -->
  <!-- y(119)=105.6  y(117)=148.4  y(107)=176.6  y(104)=217.4 -->
  <!-- wait reconsider scale. range 92..340 = 248 px for 20 units. px/unit = 12.4. y(p)=92+(120-p)*12.4 -->
  <!-- y(119)=104.4  y(117)=129.2  y(107)=253.2  y(104)=290.4 -->
  <!-- Upper wick: from body top down to high y, body x center -->
  <g transform="translate(0,0)">
    <!-- upper wick -->
    <line x1="240" y1="104.4" x2="240" y2="129.2" stroke="#2a1a0e" stroke-width="1.4"/>
    <!-- body (up candle: hollow / light fill, ink stroke) close 117 above open 107 -->
    <rect x="226" y="129.2" width="28" height="124" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.4"/>
    <!-- lower wick -->
    <line x1="240" y1="253.2" x2="240" y2="290.4" stroke="#2a1a0e" stroke-width="1.4"/>
  </g>

  <!-- horizontal guide lines and labels -->
  <line x1="180" y1="104.4" x2="226" y2="104.4" stroke="#8a8480" stroke-dasharray="2 3" stroke-width="0.7"/>
  <line x1="180" y1="129.2" x2="226" y2="129.2" stroke="#8a8480" stroke-dasharray="2 3" stroke-width="0.7"/>
  <line x1="180" y1="253.2" x2="226" y2="253.2" stroke="#8a8480" stroke-dasharray="2 3" stroke-width="0.7"/>
  <line x1="180" y1="290.4" x2="226" y2="290.4" stroke="#8a8480" stroke-dasharray="2 3" stroke-width="0.7"/>

  <!-- annotation arrows from right -->
  <text x="312" y="108" class="lb">High (119)</text>
  <path d="M 305 104.4 L 256 104.4" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ar1)"/>

  <text x="312" y="132" class="lb">Close (117)</text>
  <text x="312" y="146" class="sm">body top — up period</text>
  <path d="M 305 129.2 L 256 129.2" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ar1)"/>

  <text x="312" y="195" class="lb">Body</text>
  <text x="312" y="209" class="sm">spans open → close</text>
  <text x="312" y="222" class="sm">length encodes the move</text>
  <path d="M 305 195 L 256 195" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ar1)"/>

  <text x="312" y="257" class="lb">Open (107)</text>
  <text x="312" y="271" class="sm">body bottom — up period</text>
  <path d="M 305 253.2 L 256 253.2" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ar1)"/>

  <text x="312" y="294" class="lb">Low (104)</text>
  <path d="M 305 290.4 L 256 290.4" fill="none" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ar1)"/>

  <!-- color legend -->
  <g transform="translate(195,360)">
    <rect x="0" y="0" width="14" height="10" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
    <text x="20" y="9" class="sm">Up: close &gt; open</text>
    <rect x="125" y="0" width="14" height="10" fill="#2a1a0e"/>
    <text x="145" y="9" class="sm">Down: close &lt; open</text>
  </g>
  <text x="195" y="394" class="sm">Four variables per glyph. All four use position — Cleveland &amp; McGill rank 1.</text>

  <!-- divider -->
  <line x1="430" y1="20" x2="430" y2="420" stroke="#c8c4c0" stroke-width="0.75"/>

  <!-- RIGHT PANEL: line chart of closing prices -->
  <text x="450" y="32" class="ti">B. Line chart of closing prices</text>
  <text x="450" y="48" class="sm">Same eight periods. One variable per point — only the close.</text>

  <!-- axes -->
  <line x1="478" y1="80" x2="478" y2="340" stroke="#8a8480" stroke-width="1"/>
  <line x1="478" y1="340" x2="668" y2="340" stroke="#8a8480" stroke-width="1"/>
  <!-- y ticks at 100,110,120 scaled to 340..80 over 100..120 range = 260 px / 20 units = 13 px/unit -->
  <text x="474" y="343" text-anchor="end" class="sm">100</text>
  <text x="474" y="213" text-anchor="end" class="sm">110</text>
  <text x="474" y="83"  text-anchor="end" class="sm">120</text>
  <line x1="476" y1="340" x2="478" y2="340" stroke="#4a4540"/>
  <line x1="476" y1="210" x2="478" y2="210" stroke="#4a4540"/>
  <line x1="476" y1="80"  x2="478" y2="80"  stroke="#4a4540"/>

  <!-- 8 closing prices, x positions 490..660 step ~24 -->
  <!-- closes: 106, 110, 117, 113, 116, 112, 109, 114 -->
  <!-- y(p) = 340 - (p-100)*13 -->
  <!-- 106→262 110→210 117→119 113→171 116→132 112→184 109→223 114→158 -->
  <polyline points="490,262 514,210 538,119 562,171 586,132 610,184 634,223 658,158"
            fill="none" stroke="#2a1a0e" stroke-width="1.6"/>
  <g fill="#2a1a0e">
    <circle cx="490" cy="262" r="2.5"/>
    <circle cx="514" cy="210" r="2.5"/>
    <circle cx="538" cy="119" r="2.5"/>
    <circle cx="562" cy="171" r="2.5"/>
    <circle cx="586" cy="132" r="2.5"/>
    <circle cx="610" cy="184" r="2.5"/>
    <circle cx="634" cy="223" r="2.5"/>
    <circle cx="658" cy="158" r="2.5"/>
  </g>

  <!-- x labels: t1..t8 -->
  <g class="sm" text-anchor="middle">
    <text x="490" y="356">t1</text>
    <text x="514" y="356">t2</text>
    <text x="538" y="356">t3</text>
    <text x="562" y="356">t4</text>
    <text x="586" y="356">t5</text>
    <text x="610" y="356">t6</text>
    <text x="634" y="356">t7</text>
    <text x="658" y="356">t8</text>
  </g>

  <!-- callout: highlight that we lost the daily range -->
  <text x="478" y="380" class="sm">Trend visible. Within-period range, open, and direction — invisible.</text>
  <text x="478" y="394" class="sm">One variable encoded. Three discarded.</text>

  <!-- footer caption -->
  <text x="350" y="420" text-anchor="middle" class="cap">The candlestick encodes four variables per period; the line chart encodes one. The efficiency is the convention's claim to exist.</text>
</svg>
