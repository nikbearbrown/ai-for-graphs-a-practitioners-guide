<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t404 d404">
  <title id="t404">One dataset, three questions, three charts</title>
  <desc id="d404">Three panels using the same humanitarian funding dataset — five sectors across three years. Left: line chart of total monthly funding over time. Middle: horizontal bar chart of cumulative funding by sector. Right: 100% stacked column chart showing each year's sector composition.</desc>
  <defs>
    <style>
      .ti  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .ph  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #2a1a0e; }
      .qu  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .lb  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #2a1a0e; }
      .ax  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 9px; fill: #8a8480; }
      .vl  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 9px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .lg  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 9px; fill: #2a1a0e; }
    </style>
  </defs>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="28" text-anchor="middle" class="ti">Same dataset. Three questions. The chart follows the question, not the table.</text>

  <!-- divider lines -->
  <line x1="240" y1="50" x2="240" y2="430" stroke="#c8c4c0" stroke-width="0.5"/>
  <line x1="470" y1="50" x2="470" y2="430" stroke="#c8c4c0" stroke-width="0.5"/>

  <!-- ============== PANEL 1: LINE CHART (change over time) ============== -->
  <text x="120" y="62" text-anchor="middle" class="ph">LINE CHART</text>
  <text x="120" y="78" text-anchor="middle" class="qu">"how has total monthly</text>
  <text x="120" y="92" text-anchor="middle" class="qu">funding changed?"</text>

  <!-- plot area: x 32..208, y 108..360. width=176, height=252 -->
  <!-- y axis 0..10 USD M -->
  <g class="ax">
    <line x1="32" y1="108" x2="32" y2="360" stroke="#8a8480" stroke-width="0.5"/>
    <line x1="32" y1="360" x2="208" y2="360" stroke="#8a8480" stroke-width="0.5"/>
    <!-- y ticks 0, 5, 10 -->
    <line x1="28" y1="360" x2="32" y2="360" stroke="#8a8480"/><text x="26" y="363" text-anchor="end">0</text>
    <line x1="28" y1="234" x2="32" y2="234" stroke="#8a8480"/><text x="26" y="237" text-anchor="end">5</text>
    <line x1="28" y1="108" x2="32" y2="108" stroke="#8a8480"/><text x="26" y="111" text-anchor="end">10</text>
    <!-- x ticks 2022, 2023, 2024 — pixel positions at start of each year -->
    <line x1="32"  y1="360" x2="32"  y2="364" stroke="#8a8480"/><text x="32"  y="376" text-anchor="middle">2022</text>
    <line x1="90"  y1="360" x2="90"  y2="364" stroke="#8a8480"/><text x="90"  y="376" text-anchor="middle">2023</text>
    <line x1="149" y1="360" x2="149" y2="364" stroke="#8a8480"/><text x="149" y="376" text-anchor="middle">2024</text>
    <line x1="208" y1="360" x2="208" y2="364" stroke="#8a8480"/>
  </g>
  <text x="22" y="100" class="ax">USD millions</text>

  <!-- 36 monthly data points. x = 32 + (i/35)*176. y = 360 - (val/10)*252.
       Values fluctuate around 7.5, with dip mid-2023 then recovery -->
  <!-- vals: 8.2, 7.9, 8.1, 7.6, 7.8, 7.3, 7.5, 7.2, 7.4, 7.0, 6.8, 6.5,
              6.7, 6.4, 6.2, 5.9, 5.7, 5.4, 5.6, 5.9, 6.3, 6.6, 6.9, 7.1,
              7.3, 7.6, 7.8, 7.9, 8.2, 8.5, 8.4, 8.6, 8.8, 9.0, 8.9, 9.1 -->
  <!-- Compute path points -->
  <path d="
    M 32.00 153.36
    L 37.03 161.93
    L 42.06 156.79
    L 47.09 168.78
    L 52.11 163.64
    L 57.14 176.51
    L 62.17 171.36
    L 67.20 178.99
    L 72.23 174.43
    L 77.26 184.66
    L 82.29 189.79
    L 87.31 197.43
    L 92.34 192.30
    L 97.37 199.91
    L 102.40 205.06
    L 107.43 212.66
    L 112.46 217.80
    L 117.49 225.41
    L 122.51 220.27
    L 127.54 212.66
    L 132.57 202.53
    L 137.60 195.06
    L 142.63 187.42
    L 147.66 182.28
    L 152.69 177.14
    L 157.71 169.50
    L 162.74 164.36
    L 167.77 161.86
    L 172.80 153.46
    L 177.83 145.83
    L 182.86 148.34
    L 187.89 143.20
    L 192.91 138.07
    L 197.94 132.93
    L 202.97 135.43
    L 208.00 130.30
  " fill="none" stroke="#2a1a0e" stroke-width="1.5"/>

  <text x="120" y="404" text-anchor="middle" class="cap">total monthly funding</text>
  <text x="120" y="418" text-anchor="middle" class="cap">across all 5 sectors</text>

  <!-- ============== PANEL 2: HORIZONTAL BAR (comparison) ============== -->
  <text x="355" y="62" text-anchor="middle" class="ph">HORIZONTAL BAR CHART</text>
  <text x="355" y="78" text-anchor="middle" class="qu">"which sector received</text>
  <text x="355" y="92" text-anchor="middle" class="qu">the most cumulatively?"</text>

  <!-- plot area: x 326..450, y 120..330. Bars right of category labels at x=326. -->
  <!-- Cumulative USD M: food 84, water 56, shelter 48, health 44, protection 36
       max 84. Bar plot width = 124 (from x=326 to 450). 1 unit = 1.476px. -->
  <g>
    <line x1="326" y1="108" x2="326" y2="330" stroke="#4a4540" stroke-width="0.75"/>
    <!-- x-axis ticks 0, 40, 80 -->
    <g class="ax">
      <line x1="326" y1="330" x2="450" y2="330" stroke="#8a8480" stroke-width="0.5"/>
      <line x1="326" y1="330" x2="326" y2="334" stroke="#8a8480"/><text x="326" y="344" text-anchor="middle">0</text>
      <line x1="385.05" y1="330" x2="385.05" y2="334" stroke="#8a8480"/><text x="385.05" y="344" text-anchor="middle">40</text>
      <line x1="444.10" y1="330" x2="444.10" y2="334" stroke="#8a8480"/><text x="444.10" y="344" text-anchor="middle">80</text>
      <text x="388" y="362" text-anchor="middle" class="cap">USD millions (cumulative)</text>
    </g>

    <!-- bars: row height 36, gap 6 -->
    <rect x="326" y="124" width="123.97" height="32" fill="#2a1a0e"/>
    <text x="322" y="144" text-anchor="end" class="lb">food security</text>
    <text x="455" y="144" class="vl">84</text>

    <rect x="326" y="166" width="82.65"  height="32" fill="#4a4540"/>
    <text x="322" y="186" text-anchor="end" class="lb">water and san.</text>
    <text x="413" y="186" class="vl">56</text>

    <rect x="326" y="208" width="70.84"  height="32" fill="#4a4540"/>
    <text x="322" y="228" text-anchor="end" class="lb">shelter</text>
    <text x="401" y="228" class="vl">48</text>

    <rect x="326" y="250" width="64.94"  height="32" fill="#4a4540"/>
    <text x="322" y="270" text-anchor="end" class="lb">health</text>
    <text x="396" y="270" class="vl">44</text>

    <rect x="326" y="292" width="53.13"  height="32" fill="#8a8480"/>
    <text x="322" y="312" text-anchor="end" class="lb">protection</text>
    <text x="384" y="312" class="vl">36</text>
  </g>

  <text x="355" y="404" text-anchor="middle" class="cap">summed across all months;</text>
  <text x="355" y="418" text-anchor="middle" class="cap">time dimension collapsed</text>

  <!-- ============== PANEL 3: 100% STACKED COLUMN (part-to-whole + time) ============== -->
  <text x="585" y="62" text-anchor="middle" class="ph">100% STACKED COLUMN</text>
  <text x="585" y="78" text-anchor="middle" class="qu">"has each year's allocation</text>
  <text x="585" y="92" text-anchor="middle" class="qu">split changed?"</text>

  <!-- plot area: x 502..668. y 108..330 (height 222 from baseline 330 to top 108).
       3 columns, width 40, gap 22. col x: 510, 572, 634 -->
  <g>
    <!-- baseline -->
    <line x1="502" y1="330" x2="668" y2="330" stroke="#4a4540" stroke-width="0.75"/>
    <!-- y axis -->
    <line x1="502" y1="108" x2="502" y2="330" stroke="#8a8480" stroke-width="0.5"/>
    <g class="ax">
      <line x1="498" y1="330" x2="502" y2="330" stroke="#8a8480"/><text x="496" y="333" text-anchor="end">0%</text>
      <line x1="498" y1="274.5" x2="502" y2="274.5" stroke="#8a8480"/><text x="496" y="277.5" text-anchor="end">25</text>
      <line x1="498" y1="219" x2="502" y2="219" stroke="#8a8480"/><text x="496" y="222" text-anchor="end">50</text>
      <line x1="498" y1="163.5" x2="502" y2="163.5" stroke="#8a8480"/><text x="496" y="166.5" text-anchor="end">75</text>
      <line x1="498" y1="108" x2="502" y2="108" stroke="#8a8480"/><text x="496" y="111" text-anchor="end">100</text>
    </g>

    <!-- Year 2022 totals: food 30, water 18, shelter 15, health 14, prot 10 → 87
         proportions: 34.5, 20.7, 17.2, 16.1, 11.5
         pixel heights (222 total): 76.6, 46.0, 38.2, 35.8, 25.4 -->
    <!-- column 2022 at x=510 width=40 -->
    <rect x="510" y="253.4"  width="40" height="76.6" fill="#2a1a0e"/>
    <rect x="510" y="207.4"  width="40" height="46.0" fill="#4a4540"/>
    <rect x="510" y="169.2"  width="40" height="38.2" fill="#8a8480"/>
    <rect x="510" y="133.4"  width="40" height="35.8" fill="#a8a8a4"/>
    <rect x="510" y="108"    width="40" height="25.4" fill="#c8c4c0"/>
    <text x="530" y="344" text-anchor="middle" class="ax">2022</text>

    <!-- Year 2023: food 26, water 19, shelter 16, health 15, prot 12 → 88
         pct: 29.5, 21.6, 18.2, 17.0, 13.6
         px:  65.6, 47.9, 40.4, 37.8, 30.2 -->
    <rect x="572" y="264.4"  width="40" height="65.6" fill="#2a1a0e"/>
    <rect x="572" y="216.5"  width="40" height="47.9" fill="#4a4540"/>
    <rect x="572" y="176.1"  width="40" height="40.4" fill="#8a8480"/>
    <rect x="572" y="138.3"  width="40" height="37.8" fill="#a8a8a4"/>
    <rect x="572" y="108.1"  width="40" height="30.2" fill="#c8c4c0"/>
    <text x="592" y="344" text-anchor="middle" class="ax">2023</text>

    <!-- Year 2024: food 28, water 19, shelter 17, health 15, prot 14 → 93
         pct: 30.1, 20.4, 18.3, 16.1, 15.1
         px:  66.8, 45.4, 40.6, 35.8, 33.4 -->
    <rect x="634" y="263.2"  width="40" height="66.8" fill="#2a1a0e"/>
    <rect x="634" y="217.8"  width="40" height="45.4" fill="#4a4540"/>
    <rect x="634" y="177.2"  width="40" height="40.6" fill="#8a8480"/>
    <rect x="634" y="141.4"  width="40" height="35.8" fill="#a8a8a4"/>
    <rect x="634" y="108"    width="40" height="33.4" fill="#c8c4c0"/>
    <text x="654" y="344" text-anchor="middle" class="ax">2024</text>

    <!-- legend below -->
    <g transform="translate(498, 380)">
      <rect x="0"   y="0" width="8" height="8" fill="#2a1a0e"/><text x="12" y="7" class="lg">food</text>
      <rect x="40"  y="0" width="8" height="8" fill="#4a4540"/><text x="52" y="7" class="lg">water</text>
      <rect x="88"  y="0" width="8" height="8" fill="#8a8480"/><text x="100" y="7" class="lg">shelter</text>
      <rect x="138" y="0" width="8" height="8" fill="#a8a8a4"/><text x="150" y="7" class="lg">health</text>
      <rect x="0"   y="14" width="8" height="8" fill="#c8c4c0"/><text x="12" y="21" class="lg">protection</text>
    </g>
  </g>

  <text x="585" y="418" text-anchor="middle" class="cap">absolute amounts collapsed;</text>
  <text x="585" y="432" text-anchor="middle" class="cap">proportions directly comparable</text>

  <text x="350" y="464" text-anchor="middle" class="cap">5 sectors (food, water, shelter, health, protection) · monthly data, 2022–2024 · one dataset, three valid charts.</text>
</svg>
